<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Duel 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: 'Minecraft', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        /* UI Overlays */
        #hud {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 10;
            pointer-events: none;
        }

        .bar-container {
            display: flex;
            gap: 20px;
        }

        .hearts, .armor {
            display: flex;
            gap: 2px;
        }

        .heart, .shield {
            width: 18px;
            height: 18px;
            background-size: contain;
            background-repeat: no-repeat;
            image-rendering: pixelated;
        }

        /* Hotbar */
        #hotbar {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #3c3c3c;
            border-radius: 4px;
            padding: 2px;
            gap: 2px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .slot {
            width: 44px;
            height: 44px;
            background: rgba(139, 139, 139, 0.4);
            border: 2px solid #3c3c3c;
            border-top-color: #373737;
            border-left-color: #373737;
            border-right-color: #fff;
            border-bottom-color: #fff;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot.active {
            border: 3px solid #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }

        .slot-num {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #aaa;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 12px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        .item-icon {
            width: 32px;
            height: 32px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
        }

        /* Start / Game Over Screen */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        .overlay-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px #000;
            color: #ff5555;
            text-align: center;
        }

        .overlay-screen p {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ddd;
            text-shadow: 1px 1px #000;
            text-align: center;
        }

        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: #7289da;
            color: white;
            border: 2px solid #ffffff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #4e5d94;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #677bc4;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4e5d94;
        }

        #action-text {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: bold;
            color: #ffff55;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 15;
        }

        /* Boss Bar */
        #boss-bar-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        #boss-name {
            font-size: 14px;
            font-weight: bold;
            color: #ff5555;
            text-shadow: 1px 1px #000;
            margin-bottom: 4px;
        }
        #boss-bar {
            width: 100%;
            height: 12px;
            background: #333;
            border: 2px solid #555;
            border-radius: 2px;
            overflow: hidden;
        }
        #boss-hp {
            width: 100%;
            height: 100%;
            background: #cc0000;
            transition: width 0.1s linear;
        }

        /* Flight UI indicator */
        #elytra-status {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #55ff55;
            text-shadow: 1px 1px #000;
            pointer-events: none;
            display: none;
        }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="boss-bar-container">
        <div id="boss-name">ENEMY PLAYER</div>
        <div id="boss-bar"><div id="boss-hp"></div></div>
    </div>

    <div id="elytra-status">ELYTRA ACTIVE [SPACE TO GLIDE]</div>

    <div id="hud">
        <div class="bar-container">
            <div class="hearts" id="hearts-container"></div>
            <div class="armor" id="armor-container"></div>
        </div>
        <div id="hotbar">
            <!-- 9 slots generated dynamically -->
        </div>
    </div>

    <div id="action-text"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen">
        <h1 style="color: #55ff55;">MINECRAFT DUEL 3D</h1>
        <p>Defeat the enemy player in the arena!</p>
        <p>WASD to Move | Space to Jump/Glide | Left Click to Attack/Use Item</p>
        <p>1-9 or Scroll to Switch Items | 'E' to toggle Elytra Flight</p>
        <button class="btn">CLICK TO PLAY</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 id="game-over-title">YOU DIED!</h1>
        <p id="game-over-msg">You were defeated by Enemy Player</p>
        <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        // --- GAME CONSTANTS & STATE ---
        const ARENA_SIZE = 40;
        const PLAYER_HEIGHT = 1.8;
        
        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();

        // Game state
        let isGameStarted = false;
        let isGameOver = false;

        // Player physics & stat vars
        let player = {
            hp: 20,
            maxHp: 20,
            armor: 10,
            position: new THREE.Vector3(0, 5, 12),
            velocity: new THREE.Vector3(),
            onGround: false,
            isGliding: false,
            hasElytra: true,
            selectedSlot: 0,
            inventory: [
                { id: 'ender_pearl', name: 'Ender Pearl', count: 16, color: '#2a5d4d' },
                { id: 'firework', name: 'Firework Rocket', count: 64, color: '#c0392b' },
                { id: 'axe', name: 'Netherite Axe', count: 1, color: '#4a3b32', damage: 9 },
                { id: 'splash_potion', name: 'Splash Potion of Healing', count: 8, color: '#f39c12' },
                { id: 'obsidian', name: 'Obsidian Block', count: 64, color: '#2c3e50' },
                { id: 'bow', name: 'Bow', count: 1, color: '#8e44ad' },
                { id: 'golden_apple', name: 'Enchanted Golden Apple', count: 5, color: '#f1c40f' },
                { id: 'pickaxe', name: 'Netherite Pickaxe', count: 1, color: '#34495e' },
                { id: 'lingering_potion', name: 'Lingering Potion of Damage', count: 4, color: '#8e44ad' }
            ]
        };

        // Enemy Bot State
        let enemy = {
            mesh: null,
            hp: 20,
            maxHp: 20,
            position: new THREE.Vector3(0, 2, -12),
            velocity: new THREE.Vector3(),
            lastAttackTime: 0,
            attackCooldown: 1.2
        };

        // Controls / Inputs
        const keys = {};
        let projectiles = [];
        let particles = [];
        let blocks = [];

        // --- PROCEDURAL TEXTURES GENERATION ---
        function createPixelTexture(colorHex, noise = 0.15) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            
            const baseColor = new THREE.Color(colorHex);
            
            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    const valFactor = 1 + (Math.random() - 0.5) * noise;
                    const r = Math.min(255, Math.max(0, Math.floor(baseColor.r * 255 * valFactor)));
                    const g = Math.min(255, Math.max(0, Math.floor(baseColor.g * 255 * valFactor)));
                    const b = Math.min(255, Math.max(0, Math.floor(baseColor.b * 255 * valFactor)));
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // Texture Materials
        const materials = {
            stoneBrick: new THREE.MeshStandardMaterial({ map: createPixelTexture('#666666', 0.2), roughness: 0.8 }),
            mossyBrick: new THREE.MeshStandardMaterial({ map: createPixelTexture('#4a5d4e', 0.3), roughness: 0.8 }),
            obsidian: new THREE.MeshStandardMaterial({ map: createPixelTexture('#151022', 0.4), roughness: 0.3 }),
            woodPlank: new THREE.MeshStandardMaterial({ map: createPixelTexture('#866043', 0.2), roughness: 0.7 }),
            log: new THREE.MeshStandardMaterial({ map: createPixelTexture('#4a3728', 0.2), roughness: 0.9 }),
            goldBlock: new THREE.MeshStandardMaterial({ map: createPixelTexture('#f39c12', 0.2), metalness: 0.6, roughness: 0.2 }),
            playerSkin: new THREE.MeshStandardMaterial({ map: createPixelTexture('#c0392b', 0.3) }),
            enemySkin: new THREE.MeshStandardMaterial({ map: createPixelTexture('#2980b9', 0.3) })
        };

        // --- INIT GAME ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff);
            scene.fog = new THREE.FogExp2(0x78a7ff, 0.015);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(30, 50, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 30;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // PointerLock Controls
            controls = new THREE.PointerLockControls(camera, document.body);

            // Build Environment & Spawns
            buildArena();
            createEnemy();

            // Setup UI & Events
            setupHUD();
            setupEventListeners();

            // Window resize handle
            window.addEventListener('resize', onWindowResize);

            // Start loop
            animate();
        }

        // --- ARENA CONSTRUCTION ---
        function buildArena() {
            const geo = new THREE.BoxGeometry(1, 1, 1);

            // Floor
            for (let x = -ARENA_SIZE/2; x <= ARENA_SIZE/2; x++) {
                for (let z = -ARENA_SIZE/2; z <= ARENA_SIZE/2; z++) {
                    const isBorder = (Math.abs(x) === ARENA_SIZE/2 || Math.abs(z) === ARENA_SIZE/2);
                    const mat = isBorder ? materials.obsidian : ((x+z)%2===0 ? materials.stoneBrick : materials.mossyBrick);
                    
                    const block = new THREE.Mesh(geo, mat);
                    block.position.set(x, 0, z);
                    block.receiveShadow = true;
                    block.castShadow = true;
                    scene.add(block);
                    blocks.push(block);
                }
            }

            // Arena Pillars
            const pillarPos = [
                [-10, -10], [10, -10], [-10, 10], [10, 10]
            ];

            pillarPos.forEach(([px, pz]) => {
                for (let y = 1; y <= 6; y++) {
                    const block = new THREE.Mesh(geo, y === 6 ? materials.goldBlock : materials.log);
                    block.position.set(px, y, pz);
                    block.castShadow = true;
                    block.receiveShadow = true;
                    scene.add(block);
                    blocks.push(block);
                }
            });

            // Boundary Low Wall
            for (let i = -ARENA_SIZE/2; i <= ARENA_SIZE/2; i++) {
                createWallBlock(i, 1, -ARENA_SIZE/2);
                createWallBlock(i, 1, ARENA_SIZE/2);
                createWallBlock(-ARENA_SIZE/2, 1, i);
                createWallBlock(ARENA_SIZE/2, 1, i);
            }
        }

        function createWallBlock(x, y, z) {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const block = new THREE.Mesh(geo, materials.stoneBrick);
            block.position.set(x, y, z);
            block.castShadow = true;
            block.receiveShadow = true;
            scene.add(block);
            blocks.push(block);
        }

        // --- ENEMY MODEL CREATION ---
        function createEnemy() {
            const group = new THREE.Group();

            // Head
            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const head = new THREE.Mesh(headGeo, materials.enemySkin);
            head.position.y = 1.5;
            head.castShadow = true;
            group.add(head);

            // Body
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.75, 0.3);
            const body = new THREE.Mesh(bodyGeo, materials.obsidian);
            body.position.y = 0.875;
            body.castShadow = true;
            group.add(body);

            // Sword in hand
            const weaponGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
            const weapon = new THREE.Mesh(weaponGeo, materials.goldBlock);
            weapon.position.set(0.4, 0.8, 0.3);
            weapon.rotation.x = Math.PI / 4;
            group.add(weapon);

            group.position.copy(enemy.position);
            scene.add(group);
            enemy.mesh = group;
        }

        // --- EVENT LISTENERS & INPUTS ---
        function setupEventListeners() {
            const startBtn = document.querySelector('#start-screen .btn');
            startBtn.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                document.getElementById('start-screen').style.display = 'none';
                isGameStarted = true;
            });

            controls.addEventListener('unlock', () => {
                if (!isGameOver) {
                    document.getElementById('start-screen').style.display = 'flex';
                }
            });

            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;

                // Hotbar keys 1-9
                if (e.code.startsWith('Digit') && e.code !== 'Digit0') {
                    const num = parseInt(e.code.replace('Digit', '')) - 1;
                    if (num >= 0 && num < 9) selectSlot(num);
                }

                // Elytra toggle
                if (e.code === 'KeyE') {
                    player.isGliding = !player.isGliding;
                    showActionText(player.isGliding ? "Elytra Deployed!" : "Elytra Stowed");
                    document.getElementById('elytra-status').style.display = player.isGliding ? 'block' : 'none';
                }

                // Jump / Flight boost
                if (e.code === 'Space') {
                    if (player.onGround) {
                        player.velocity.y = 8;
                        player.onGround = false;
                    } else if (player.isGliding) {
                        player.velocity.y += 3; // Elytra swoop
                    }
                }
            });

            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            document.addEventListener('wheel', (e) => {
                if (e.deltaY > 0) {
                    selectSlot((player.selectedSlot + 1) % 9);
                } else {
                    selectSlot((player.selectedSlot + 8) % 9);
                }
            });

            document.addEventListener('mousedown', (e) => {
                if (!controls.isLocked || isGameOver) return;
                if (e.button === 0) { // Left Click
                    useSelectedItem();
                }
            });
        }

        function selectSlot(index) {
            player.selectedSlot = index;
            const slots = document.querySelectorAll('.slot');
            slots.forEach((s, idx) => {
                s.classList.toggle('active', idx === index);
            });
        }

        function setupHUD() {
            // Hearts
            const heartsContainer = document.getElementById('hearts-container');
            heartsContainer.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.backgroundColor = '#e74c3c';
                heart.style.borderRadius = '50%';
                heartsContainer.appendChild(heart);
            }

            // Armor
            const armorContainer = document.getElementById('armor-container');
            armorContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const shield = document.createElement('div');
                shield.className = 'shield';
                shield.style.backgroundColor = '#95a5a6';
                armorContainer.appendChild(shield);
            }

            // Hotbar Slots
            const hotbar = document.getElementById('hotbar');
            hotbar.innerHTML = '';
            player.inventory.forEach((item, idx) => {
                const slot = document.createElement('div');
                slot.className = `slot ${idx === 0 ? 'active' : ''}`;
                
                const num = document.createElement('div');
                num.className = 'slot-num';
                num.innerText = idx + 1;

                const icon = document.createElement('div');
                icon.className = 'item-icon';
                icon.style.backgroundColor = item.color;
                icon.style.borderRadius = '4px';

                const count = document.createElement('div');
                count.className = 'slot-count';
                count.innerText = item.count > 1 ? item.count : '';

                slot.appendChild(num);
                slot.appendChild(icon);
                slot.appendChild(count);
                hotbar.appendChild(slot);
            });
        }

        function showActionText(text) {
            const el = document.getElementById('action-text');
            el.innerText = text;
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 1200);
        }

        // --- ITEM USAGE LOGIC ---
        function useSelectedItem() {
            const item = player.inventory[player.selectedSlot];
            if (!item || item.count <= 0) return;

            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);

            if (item.id === 'ender_pearl') {
                launchProjectile('pearl', camDir, 25);
                item.count--;
                showActionText("Ender Pearl Thrown!");
            } 
            else if (item.id === 'firework') {
                // Boost player direction
                player.velocity.add(camDir.clone().multiplyScalar(20));
                createParticles(camera.position, '#ff3300', 15);
                item.count--;
                showActionText("FIREWORK BOOST LAUNCH!");
            } 
            else if (item.id === 'axe' || item.id === 'pickaxe') {
                // Melee hit
                const raycaster = new THREE.Raycaster(camera.position, camDir, 0, 3.5);
                const intersects = raycaster.intersectObject(enemy.mesh, true);
                if (intersects.length > 0) {
                    damageEnemy(item.damage || 6);
                    createParticles(intersects[0].point, '#ff0000', 10);
                } else {
                    showActionText("Swing!");
                }
            } 
            else if (item.id === 'splash_potion') {
                player.hp = Math.min(player.maxHp, player.hp + 6);
                updateHealthUI();
                createParticles(camera.position, '#2ecc71', 20);
                item.count--;
                showActionText("Splash Potion Healed!");
            } 
            else if (item.id === 'obsidian') {
                // Place block in front
                const placePos = camera.position.clone().add(camDir.clone().multiplyScalar(2.5));
                placePos.x = Math.round(placePos.x);
                placePos.y = Math.round(placePos.y);
                placePos.z = Math.round(placePos.z);

                const geo = new THREE.BoxGeometry(1, 1, 1);
                const block = new THREE.Mesh(geo, materials.obsidian);
                block.position.copy(placePos);
                block.castShadow = true;
                block.receiveShadow = true;
                scene.add(block);
                blocks.push(block);

                item.count--;
                showActionText("Obsidian Placed!");
            } 
            else if (item.id === 'bow') {
                launchProjectile('arrow', camDir, 35);
                showActionText("Arrow Shot!");
            } 
            else if (item.id === 'golden_apple') {
                player.hp = player.maxHp;
                updateHealthUI();
                createParticles(camera.position, '#f1c40f', 25);
                item.count--;
                showActionText("Gapple Eaten! Full HP!");
            } 
            else if (item.id === 'lingering_potion') {
                launchProjectile('lingering', camDir, 18);
                item.count--;
                showActionText("Lingering Potion Thrown!");
            }

            setupHUD();
        }

        // --- PROJECTILES & PARTICLES ---
        function launchProjectile(type, direction, speed) {
            const geo = (type === 'arrow') ? new THREE.CylinderGeometry(0.03, 0.03, 0.5) : new THREE.SphereGeometry(0.15, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ 
                color: type === 'pearl' ? 0x16a085 : (type === 'arrow' ? 0xcccccc : 0x9b59b6) 
            });
            
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(camera.position).add(direction.clone().multiplyScalar(0.5));
            
            if (type === 'arrow') {
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            }

            scene.add(mesh);

            projectiles.push({
                mesh: mesh,
                velocity: direction.clone().multiplyScalar(speed),
                type: type,
                life: 5.0
            });
        }

        function createParticles(pos, colorHex, count) {
            const pGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex });

            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 6,
                    (Math.random() - 0.5) * 6,
                    (Math.random() - 0.5) * 6
                );
                scene.add(p);
                particles.push({ mesh: p, velocity: vel, life: 0.6 });
            }
        }

        // --- DAMAGE & COMBAT ---
        function damageEnemy(amount) {
            enemy.hp -= amount;
            if (enemy.hp < 0) enemy.hp = 0;
            
            // Knockback
            const kbDir = enemy.position.clone().sub(camera.position).normalize();
            enemy.velocity.add(kbDir.multiplyScalar(6));
            enemy.velocity.y += 2;

            // Update Bossbar
            const pct = (enemy.hp / enemy.maxHp) * 100;
            document.getElementById('boss-hp').style.width = pct + '%';

            if (enemy.hp <= 0) {
                endGame(true);
            }
        }

        function damagePlayer(amount) {
            player.hp -= amount;
            if (player.hp < 0) player.hp = 0;
            updateHealthUI();

            // Screen pulse Red effect
            document.body.style.backgroundColor = '#500';
            setTimeout(() => { document.body.style.backgroundColor = '#111'; }, 100);

            if (player.hp <= 0) {
                endGame(false);
            }
        }

        function updateHealthUI() {
            const hearts = document.querySelectorAll('.heart');
            const activeHearts = Math.ceil(player.hp / 2);
            hearts.forEach((h, idx) => {
                h.style.opacity = idx < activeHearts ? '1' : '0.2';
            });
        }

        function endGame(victory) {
            isGameOver = true;
            controls.unlock();
            const screen = document.getElementById('game-over-screen');
            const title = document.getElementById('game-over-title');
            const msg = document.getElementById('game-over-msg');

            screen.style.display = 'flex';
            if (victory) {
                title.innerText = "VICTORY!";
                title.style.color = "#55ff55";
                msg.innerText = "You defeated the enemy player!";
            } else {
                title.innerText = "YOU DIED!";
                title.style.color = "#ff5555";
                msg.innerText = "You were slayed in combat!";
            }
        }

        // --- GAME LOOP & UPDATES ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (isGameStarted && !isGameOver) {
                updatePlayer(delta);
                updateEnemy(delta);
                updateProjectiles(delta);
                updateParticles(delta);
            }

            renderer.render(scene, camera);
        }

        function updatePlayer(delta) {
            // Friction/Damping
            player.velocity.x *= 0.85;
            player.velocity.z *= 0.85;

            // Gravity
            if (player.isGliding) {
                player.velocity.y -= 9.8 * 0.25 * delta; // Slow fall with Elytra
            } else {
                player.velocity.y -= 9.8 * 2.0 * delta;
            }

            // Keyboard input vector
            const moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;
            moveDir.normalize();

            // Transform relative to camera direction
            if (controls.isLocked) {
                const moveSpeed = player.isGliding ? 18 : 10;
                if (keys['KeyW'] || keys['KeyS']) {
                    const front = new THREE.Vector3();
                    camera.getWorldDirection(front);
                    if (!player.isGliding) front.y = 0;
                    front.normalize();
                    player.velocity.add(front.multiplyScalar(moveDir.z * moveSpeed * delta * -1));
                }
                if (keys['KeyA'] || keys['KeyD']) {
                    const side = new THREE.Vector3();
                    camera.getWorldDirection(side);
                    side.cross(new THREE.Vector3(0, 1, 0)).normalize();
                    player.velocity.add(side.multiplyScalar(moveDir.x * moveSpeed * delta));
                }
            }

            // Apply Velocity
            const nextPos = camera.position.clone().add(player.velocity.clone().multiplyScalar(delta));

            // Ground Collision
            if (nextPos.y <= PLAYER_HEIGHT) {
                nextPos.y = PLAYER_HEIGHT;
                player.velocity.y = 0;
                player.onGround = true;
            }

            camera.position.copy(nextPos);
        }

        function updateEnemy(delta) {
            if (!enemy.mesh) return;

            // AI movement - chase player
            const pPos = camera.position.clone();
            pPos.y = enemy.position.y; // horizontal distance
            const dist = enemy.position.distanceTo(pPos);

            if (dist > 2.0) {
                const dir = pPos.sub(enemy.position).normalize();
                enemy.velocity.x = dir.x * 4.5;
                enemy.velocity.z = dir.z * 4.5;
            } else {
                enemy.velocity.x *= 0.5;
                enemy.velocity.z *= 0.5;

                // Melee attack player
                if (clock.getElapsedTime() - enemy.lastAttackTime > enemy.attackCooldown) {
                    damagePlayer(3);
                    enemy.lastAttackTime = clock.getElapsedTime();
                }
            }

            // Gravity on Enemy
            enemy.velocity.y -= 9.8 * 2.0 * delta;

            // Move & Ground check
            enemy.position.add(enemy.velocity.clone().multiplyScalar(delta));
            if (enemy.position.y <= 1.0) {
                enemy.position.y = 1.0;
                enemy.velocity.y = 0;
            }

            // Orient towards player
            enemy.mesh.lookAt(camera.position.x, enemy.mesh.position.y, camera.position.z);
            enemy.mesh.position.copy(enemy.position);
        }

        function updateProjectiles(delta) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.life -= delta;
                
                // Gravity on pearl/potion/arrow
                p.velocity.y -= 9.8 * delta;
                p.mesh.position.add(p.velocity.clone().multiplyScalar(delta));

                // Hit enemy check
                if (p.mesh.position.distanceTo(enemy.position) < 1.2) {
                    if (p.type === 'pearl') {
                        camera.position.copy(p.mesh.position);
                        showActionText("Teleported!");
                    } else if (p.type === 'arrow') {
                        damageEnemy(5);
                    } else if (p.type === 'lingering') {
                        damageEnemy(8);
                        createParticles(p.mesh.position, '#8e44ad', 30);
                    }
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                    continue;
                }

                // Ground hit check
                if (p.mesh.position.y <= 0.5 || p.life <= 0) {
                    if (p.type === 'pearl') {
                        camera.position.copy(p.mesh.position);
                        camera.position.y = Math.max(camera.position.y, PLAYER_HEIGHT);
                        showActionText("Teleported!");
                    } else if (p.type === 'lingering') {
                        createParticles(p.mesh.position, '#8e44ad', 25);
                    }
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= delta;
                p.mesh.position.add(p.velocity.clone().multiplyScalar(delta));
                p.mesh.scale.multiplyScalar(0.92);

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Run setup on load
        window.onload = init;
    </script>
</body>
</html>
