<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Donut SMP - End Crystal PvP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 2px #000; }
        #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
        #crosshair::after { left: 0; top: 7px; width: 16px; height: 2px; }
        
        /* Flash Overlays */
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0); pointer-events: none; z-index: 4; transition: background 0.05s ease-out; }
        
        /* Totem Pop Overlay */
        #totem-pop-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            pointer-events: none; z-index: 8; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            font-size: 130px; text-shadow: 0 0 20px #ffaa00;
        }
        #totem-pop-overlay.active { transform: translate(-50%, -50%) scale(1.4); }

        /* Death Screen Overlay */
        #death-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(120, 0, 0, 0.4); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 40; pointer-events: auto;
        }
        #death-box {
            text-align: center; padding: 25px; background: rgba(20, 20, 20, 0.92);
            border: 4px solid #ff0000; box-shadow: 0 0 35px #ff0000; border-radius: 6px;
            width: 420px; max-width: 90%;
        }
        #death-box h1 { color: #ff2222; font-size: 38px; font-weight: bold; text-shadow: 3px 3px #000; margin-bottom: 8px; letter-spacing: 2px; }
        #death-box p { color: #ccc; font-size: 14px; margin-bottom: 20px; font-weight: bold; text-shadow: 1px 1px #000; }
        .respawn-btn {
            background: #555; color: #fff; border: 3px solid #888; padding: 12px 30px;
            font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit;
            border-radius: 4px; box-shadow: 0 4px #222;
        }
        .respawn-btn:hover { background: #666; border-color: #aaa; }
        .respawn-btn:active { transform: translateY(2px); box-shadow: 0 2px #222; }

        /* HUD Container */
        #hud { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 7; }
        
        /* Hearts & Food Row */
        .status-wrapper { display: flex; justify-content: space-between; width: 100%; margin-bottom: 6px; gap: 10px; }
        .hearts-bar, .food-bar { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 4px; border: 2px solid #3c3c3c; }
        .heart-wrapper, .shank-wrapper { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        
        /* Pixel Art Icons */
        .pixel-heart {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                2px 0px 0 #000, 3px 0px 0 #000, 6px 0px 0 #000, 7px 0px 0 #000,
                1px 1px 0 #000, 2px 1px 0 #e02424, 3px 1px 0 #ff6b6b, 4px 1px 0 #000, 5px 1px 0 #000, 6px 1px 0 #e02424, 7px 1px 0 #e02424, 8px 1px 0 #000,
                0px 2px 0 #000, 1px 2px 0 #ffffff, 2px 2px 0 #ff6b6b, 3px 2px 0 #e02424, 4px 2px 0 #e02424, 5px 2px 0 #e02424, 6px 2px 0 #e02424, 7px 2px 0 #9c0000, 8px 2px 0 #000,
                0px 3px 0 #000, 1px 3px 0 #ff6b6b, 2px 3px 0 #e02424, 3px 3px 0 #e02424, 4px 3px 0 #e02424, 5px 3px 0 #e02424, 6px 3px 0 #e02424, 7px 3px 0 #9c0000, 8px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #e02424, 2px 4px 0 #e02424, 3px 4px 0 #e02424, 4px 4px 0 #e02424, 5px 4px 0 #e02424, 6px 4px 0 #e02424, 7px 4px 0 #9c0000, 8px 4px 0 #000,
                1px 5px 0 #000, 2px 5px 0 #e02424, 3px 5px 0 #e02424, 4px 5px 0 #e02424, 5px 5px 0 #e02424, 6px 5px 0 #9c0000, 7px 5px 0 #000,
                2px 6px 0 #000, 3px 6px 0 #e02424, 4px 6px 0 #e02424, 5px 6px 0 #9c0000, 6px 6px 0 #000,
                3px 7px 0 #000, 4px 7px 0 #e02424, 5px 7px 0 #000, 4px 8px 0 #000;
            transform: scale(1.6); transition: opacity 0.2s;
        }
        .pixel-heart.empty { opacity: 0.2; }

        .pixel-shank {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                4px 0px 0 #000, 5px 0px 0 #000,
                3px 1px 0 #000, 4px 1px 0 #d1a880, 5px 1px 0 #bd6328, 6px 1px 0 #000,
                2px 2px 0 #000, 3px 2px 0 #d1a880, 4px 2px 0 #bd6328, 5px 2px 0 #8b3a0f, 6px 2px 0 #000,
                1px 3px 0 #000, 2px 3px 0 #bd6328, 3px 3px 0 #bd6328, 4px 3px 0 #8b3a0f, 5px 3px 0 #5c2204, 6px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #bd6328, 2px 4px 0 #8b3a0f, 3px 4px 0 #8b3a0f, 4px 4px 0 #5c2204, 5px 4px 0 #000,
                0px 5px 0 #000, 1px 5px 0 #8b3a0f, 2px 5px 0 #8b3a0f, 3px 5px 0 #000,
                0px 6px 0 #000, 1px 6px 0 #d1a880, 2px 6px 0 #000,
                1px 7px 0 #000, 2px 7px 0 #ffffff, 3px 7px 0 #000, 2px 8px 0 #000;
            transform: scale(1.6);
        }

        .pixel-gapple {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                4px 0px 0 #5c2204, 5px 0px 0 #5c2204, 4px 1px 0 #5c2204,
                2px 2px 0 #000, 3px 2px 0 #000, 6px 2px 0 #000, 7px 2px 0 #000,
                1px 3px 0 #000, 2px 3px 0 #fff3a1, 3px 3px 0 #ffd700, 4px 3px 0 #000, 5px 3px 0 #000, 6px 3px 0 #ffd700, 7px 3px 0 #ffd700, 8px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #ffffff, 2px 4px 0 #ffd700, 3px 4px 0 #ffaa00, 4px 4px 0 #ffaa00, 5px 4px 0 #ffaa00, 6px 4px 0 #ffaa00, 7px 4px 0 #c77b00, 8px 4px 0 #000,
                0px 5px 0 #000, 1px 5px 0 #ffd700, 2px 5px 0 #ffaa00, 3px 5px 0 #ffaa00, 4px 5px 0 #ffaa00, 5px 5px 0 #ffaa00, 6px 5px 0 #ffaa00, 7px 5px 0 #c77b00, 8px 5px 0 #000,
                0px 6px 0 #000, 1px 6px 0 #ffaa00, 2px 6px 0 #ffaa00, 3px 6px 0 #ffaa00, 4px 6px 0 #ffaa00, 5px 6px 0 #ffaa00, 6px 6px 0 #ffaa00, 7px 6px 0 #c77b00, 8px 6px 0 #000,
                1px 7px 0 #000, 2px 7px 0 #ffaa00, 3px 7px 0 #ffaa00, 4px 7px 0 #ffaa00, 5px 7px 0 #ffaa00, 6px 7px 0 #c77b00, 7px 7px 0 #000,
                2px 8px 0 #000, 3px 8px 0 #ffaa00, 4px 8px 0 #ffaa00, 5px 8px 0 #c77b00, 6px 8px 0 #000,
                3px 9px 0 #000, 4px 9px 0 #ffaa00, 5px 9px 0 #000, 4px 10px 0 #000;
            transform: scale(1.5);
        }

        /* Inventory & Hotbar UI */
        #hotbar-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: auto; }
        #hotbar { display: flex; background: rgba(0, 0, 0, 0.7); border: 3px solid #3c3c3c; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .slot { width: 40px; height: 40px; border: 2px solid #8b8b8b; background: rgba(139, 139, 139, 0.3); margin: 2px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 16px; position: relative; cursor: pointer; }
        .slot.active { border-color: #ffffff; background: rgba(255, 255, 255, 0.4); box-shadow: inset 0 0 8px #fff; }
        .slot.selected-drag { border-color: #ffaa00; background: rgba(255, 170, 0, 0.5); }
        .slot-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: #aaa; font-weight: bold; }
        .count-badge { position: absolute; bottom: 1px; right: 2px; font-size: 9px; color: #fff; font-weight: bold; text-shadow: 1px 1px #000; }

        /* Full Inventory GUI Screen (Opened with 'E') */
        #inventory-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 380px; background: #c6c6c6; border: 4px solid #373737; border-radius: 6px;
            padding: 15px; display: none; flex-direction: column; gap: 10px; z-index: 20;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8); pointer-events: auto;
        }
        #inventory-screen h3 { color: #373737; font-size: 16px; margin-bottom: 5px; text-align: center; font-weight: bold; }
        .inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #8b8b8b; padding: 6px; border: 3px solid #373737; }
        .inv-slot { width: 34px; height: 34px; background: #8b8b8b; border: 2px solid #373737; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; position: relative; }
        .inv-slot:hover { background: #aaaaaa; }
        .inv-slot.selected-drag { border-color: #ffaa00; background: #d4a373; }

        /* Mobile Controls Overlays */
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; z-index: 6; display: none; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; }
        
        #mobile-buttons { position: absolute; bottom: 20px; right: 20px; display: none; flex-direction: column; gap: 8px; z-index: 6; }
        .mobile-btn { width: 54px; height: 54px; background: rgba(0, 0, 0, 0.6); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 12px; font-weight: bold; display: flex; justify-content: center; align-items: center; text-align: center; }
        .mobile-btn:active { background: rgba(255, 255, 255, 0.4); }

        /* Action Text Overlay */
        #action-text { position: absolute; top: 60%; left: 50%; transform: translateX(-50%); color: #ffeb3b; font-size: 16px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5; }

        /* Settings Options UI */
        .option-group { display: flex; flex-direction: column; gap: 4px; text-align: left; margin-bottom: 8px; }
        .option-group label { color: #aaa; font-size: 12px; font-weight: bold; }
        .option-select, .option-input { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #ffaa00; border-radius: 4px; font-family: inherit; font-size: 13px; }

        /* Start Screen Blocker */
        #blocker { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 30; }
        #instructions { text-align: center; padding: 25px; background: rgba(20, 20, 20, 0.95); border: 3px solid #ff0055; box-shadow: 0 0 30px #ff0055; border-radius: 8px; max-width: 90%; width: 480px; max-height: 90vh; overflow-y: auto; }
        .mode-btn { margin: 8px 0; padding: 12px; width: 100%; background: #ff0055; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .mode-btn:hover { background: #ff3377; }
        #room-input { width: 100%; padding: 10px; margin: 8px 0; text-align: center; font-size: 18px; border-radius: 5px; border: 2px solid #ffaa00; background: #222; color: #fff; }
        
        /* Multiplayer Buttons Group */
        .mp-btn-container { display: flex; gap: 10px; width: 100%; }
        .mp-btn { flex: 1; margin: 4px 0; padding: 10px; color: #fff; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
    <!-- Three.js, PointerLockControls & PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="crosshair"></div>
        <div id="flash-overlay"></div>
        <div id="totem-pop-overlay">🗿</div>
        <div id="action-text">Arena Floor Setting Updated!</div>

        <!-- Death Screen Menu -->
        <div id="death-screen">
            <div id="death-box">
                <h1>YOU DIED!</h1>
                <p>YOU WERE SLAIN BY AI STEVE!</p>
                <button class="respawn-btn" id="btn-respawn">RESPAWN</button>
            </div>
        </div>

        <!-- Touch Joysticks & Buttons -->
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="mobile-buttons">
            <div class="mobile-btn" id="btn-inv" style="border-color:#ffaa00;">INV</div>
            <div class="mobile-btn" id="btn-jump">JUMP</div>
            <div class="mobile-btn" id="btn-hit" style="border-color:#ff5555;">HIT</div>
            <div class="mobile-btn" id="btn-place" style="border-color:#55ff55;">PLACE</div>
        </div>

        <!-- Full Inventory GUI Screen (Opened with 'E') -->
        <div id="inventory-screen">
            <h3>PLAYER INVENTORY (Press E to Close)[cite: 3]</h3>
            <div class="inv-grid" id="inv-grid-container"></div>
            <p style="font-size: 11px; color: #333; text-align: center; margin-top: 5px;">Click slot A then slot B to shift/swap items anywhere!</p>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="status-wrapper">
                <div class="hearts-bar" id="hearts-container">
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                </div>
                <div class="food-bar">
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                </div>
            </div>

            <!-- Hotbar (9 Slots) -->
            <div id="hotbar-wrapper">
                <div id="hotbar">
                    <div class="slot active" id="slot-1" onclick="handleSlotClick('hotbar', 0)"><span class="slot-num">1</span><span class="slot-icon">🗡️</span><span class="count-badge" id="hotbar-count-0"></span></div>
                    <div class="slot" id="slot-2" onclick="handleSlotClick('hotbar', 1)"><span class="slot-num">2</span><span class="slot-icon"><div class="pixel-gapple"></div></span><span class="count-badge" id="hotbar-count-1">64</span></div>
                    <div class="slot" id="slot-3" onclick="handleSlotClick('hotbar', 2)"><span class="slot-num">3</span><span class="slot-icon">🔮</span><span class="count-badge" id="hotbar-count-2">64</span></div>
                    <div class="slot" id="slot-4" onclick="handleSlotClick('hotbar', 3)"><span class="slot-num">4</span><span class="slot-icon">⬛</span><span class="count-badge" id="hotbar-count-3">64</span></div>
                    <div class="slot" id="slot-5" onclick="handleSlotClick('hotbar', 4)"><span class="slot-num">5</span><span class="slot-icon">🗿</span><span class="count-badge" id="hotbar-count-4">64</span></div>
                    <div class="slot" id="slot-6" onclick="handleSlotClick('hotbar', 5)"><span class="slot-num">6</span><span class="slot-icon">🏹</span><span class="count-badge" id="hotbar-count-5">64</span></div>
                    <div class="slot" id="slot-7" onclick="handleSlotClick('hotbar', 6)"><span class="slot-num">7</span><span class="slot-icon">🚀</span><span class="count-badge" id="hotbar-count-6">64</span></div>
                    <div class="slot" id="slot-8" onclick="handleSlotClick('hotbar', 7)"><span class="slot-num">8</span><span class="slot-icon">🔨</span><span class="count-badge" id="hotbar-count-7">64</span></div>
                    <div class="slot" id="slot-9" onclick="handleSlotClick('hotbar', 8)"><span class="slot-num">9</span><span class="slot-icon">🟣</span><span class="count-badge" id="hotbar-count-8">64</span></div>
                </div>
            </div>
        </div>

        <!-- Start Overlay -->
        <div id="blocker">
            <div id="instructions">
                <h1 style="color:#ff0055; margin-bottom:10px; font-size: 22px;">DONUT SMP CRYSTAL PVP</h1>
                
                <div style="background: #111; padding: 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #333;">
                    <div class="option-group">
                        <label>BOT DIFFICULTY (FOR VS AI BOT)</label>
                        <select id="bot-difficulty-select" class="option-select">
                            <option value="easy">Easy Mode</option>
                            <option value="medium" selected>Medium Mode</option>
                            <option value="hard">Hard Mode</option>
                        </select>
                    </div>

                    <div class="option-group">
                        <label>FIELD OF VIEW (FOV)</label>
                        <select id="fov-select" class="option-select">
                            <option value="60">60° (Narrow)</option>
                            <option value="75" selected>75° (Standard)</option>
                            <option value="90">90° (Quake Pro / Wide)</option>
                            <option value="110">110° (Ultra Wide)</option>
                        </select>
                    </div>
                </div>

                <p style="color:#ffaa00; font-weight:bold; margin-bottom:12px; font-size: 15px;">Choose Mode to Play:</p>
                
                <button class="mode-btn" id="btn-mode-ai">1. PLAY VS UPGRADED STEVE AI BOT</button>
                <button class="mode-btn" id="btn-mode-bro" style="background:#aa00ff;">2. PLAY ON SINGLE DEVICE (2P DUEL)</button>
                
                <hr style="margin:10px 0; border:1px solid #444;">
                
                <input type="number" id="room-input" placeholder="Enter Room Code (e.g. 1234)" />
                <div class="mp-btn-container">
                    <button class="mp-btn" id="btn-join-mp" style="background:#0077ff; width:100%;">JOIN / HOST ROOM</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        let prevTime = performance.now();

        const PLAYER_EYE_HEIGHT = 1.6;

        let botDifficulty = 'medium';
        let isMobile = false;
        let touchLookID = null, touchMoveID = null;
        let touchLookLastX = 0, touchLookLastY = 0;
        let joystickCenter = { x: 0, y: 0 };
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');

        let currentSlot = 1; 
        let playerHealth = 10;
        const maxHealth = 10;
        let textTimeout = null;
        let isInventoryOpen = false;

        // Inventory data arrays (Hotbar: 9 slots, Main Inventory: 27 slots with a balanced mix)
        let hotbarData = [
            { icon: '🗡', type: 'sword', count: '' },
            { icon: '<div class="pixel-gapple"></div>', type: 'gapple', count: 64 },
            { icon: '🔮', type: 'crystal', count: 64 },
            { icon: '⬛', type: 'obsidian', count: 64 },
            { icon: '🗿', type: 'totem', count: 64 },
            { icon: '🏹', type: 'arrow', count: 64 },
            { icon: '🚀', type: 'firework', count: 64 },
            { icon: '🔨', type: 'mace', count: 64 },
            { icon: '🟣', type: 'enderpearl', count: 64 }
        ];

        let inventoryData = [
            { icon: '🔮', type: 'crystal', count: 64 }, { icon: '🔮', type: 'crystal', count: 64 }, { icon: '🔮', type: 'crystal', count: 64 },
            { icon: '⬛', type: 'obsidian', count: 64 }, { icon: '⬛', type: 'obsidian', count: 64 }, { icon: '⬛', type: 'obsidian', count: 64 },
            { icon: '<div class="pixel-gapple"></div>', type: 'gapple', count: 64 }, { icon: '<div class="pixel-gapple"></div>', type: 'gapple', count: 64 }, { icon: '<div class="pixel-gapple"></div>', type: 'gapple', count: 64 },
            { icon: '🗿', type: 'totem', count: 64 }, { icon: '🗿', type: 'totem', count: 64 }, { icon: '🗿', type: 'totem', count: 64 },
            { icon: '🚀', type: 'firework', count: 64 }, { icon: '🚀', type: 'firework', count: 64 }, { icon: '🚀', type: 'firework', count: 64 },
            { icon: '🟣', type: 'enderpearl', count: 64 }, { icon: '🟣', type: 'enderpearl', count: 64 }, { icon: '🟣', type: 'enderpearl', count: 64 },
            { icon: '🏹', type: 'arrow', count: 64 }, { icon: '🏹', type: 'arrow', count: 64 }, { icon: '🏹', type: 'arrow', count: 64 },
            { icon: '🔨', type: 'mace', count: 64 }, { icon: '🔮', type: 'crystal', count: 64 }, { icon: '⬛', type: 'obsidian', count: 64 },
            { icon: '<div class="pixel-gapple"></div>', type: 'gapple', count: 64 }, { icon: '🗿', type: 'totem', count: 64 }, { icon: '🚀', type: 'firework', count: 64 }
        ];

        // Drag and drop tracking state
        let draggedItem = null;

        let counts = { 
            get gapple() { return getCountByType('gapple'); },
            set gapple(val) { setCountByType('gapple', val); },

        function getCountByType(type) {
            let total = 0;
            hotbarData.forEach(item => { if (item && item.type === type) total += (typeof item.count === 'number' ? item.count : 1); });
            inventoryData.forEach(item => { if (item && item.type === type) total += (typeof item.count === 'number' ? item.count : 1); });
            return total;
        }

        function setCountByType(type, val) {
            let rem = val;
            hotbarData.forEach(item => {
                if (item && item.type === type) {
                    item.count = Math.min(64, rem);
                    rem -= item.count;
                }
            });
            inventoryData.forEach(item => {
                if (item && item.type === type) {
                    item.count = Math.min(64, rem);
                    rem -= item.count;
                }
            });
            updateInventoryUI();
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'explode') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.6);
                gain.gain.setValueAtTime(1.0, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'mace') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                gain.gain.setValueAtTime(0.9, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'shoot' || type === 'pearl') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(type === 'pearl' ? 450 : 600, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'firework') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'place') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'sword') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'totem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        function updateInventoryUI() {
            // Update Hotbar UI
            for (let i = 0; i < 9; i++) {
                const item = hotbarData[i];
                const slotEl = document.getElementById(`slot-${i + 1}`);
                if (!slotEl) continue;
                const iconSpan = slotEl.querySelector('.slot-icon');
                const countSpan = document.getElementById(`hotbar-count-${i}`);

                if (item) {
                    iconSpan.innerHTML = item.icon;
                    countSpan.innerText = item.count !== '' ? item.count : '';
                } else {
                    iconSpan.innerHTML = '';
                    countSpan.innerText = '';
                }
            }

            // Update Full Inventory Screen UI
            const container = document.getElementById('inv-grid-container');
            container.innerHTML = '';

            inventoryData.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                if (draggedItem && draggedItem.container === 'inventory' && draggedItem.index === index) {
                    slot.classList.add('selected-drag');
                }
                
                let innerHTML = '';
                if (item) {
                    innerHTML = `${item.icon}<span class="count-badge">${item.count}</span>`;
                }
                slot.innerHTML = innerHTML;
                slot.onclick = () => handleSlotClick('inventory', index);
                container.appendChild(slot);
            });
        }

        function handleSlotClick(containerName, index) {
            const targetCollection = containerName === 'hotbar' ? hotbarData : inventoryData;
            const clickedItem = targetCollection[index];

            if (!draggedItem) {
                if (!clickedItem) return; // Empty slot clicked
                draggedItem = { container: containerName, index: index, item: clickedItem };
                showActionText("Picked up item. Click destination slot!");
                playSound('eat');
            } else {
                // Swap or place into destination slot
                targetCollection[index] = draggedItem.item;
                
                const origCollection = draggedItem.container === 'hotbar' ? hotbarData : inventoryData;
                origCollection[draggedItem.index] = clickedItem;

                draggedItem = null;
                playSound('place');
                showActionText("Shifted / Swapped slot successfully!");
            }

            updateInventoryUI();
            selectSlot(currentSlot); // refresh active held item
        }

        function updateAISteveLogic(delta) {
            if (!aiSteveMesh) return;
            if (aiSteveHealthBarMesh) aiSteveHealthBarMesh.lookAt(camera.position);

            const playerPos = camera.position;
            const dist = aiSteveMesh.position.distanceTo(playerPos);

            let speedMult = 1.0, hitInterval = 1.2, fireworkCooldown = 5.0, cbInterval = 4.0;
            if (botDifficulty === 'easy') {
                speedMult = 0.6; hitInterval = 2.0; fireworkCooldown = 8.0; cbInterval = 6.0;
            } else if (botDifficulty === 'hard') {
                speedMult = 1.5; hitInterval = 0.7; fireworkCooldown = 3.0; cbInterval = 2.0;
            }

            aiSteveCrossbowTimer += delta;
            if (aiSteveCrossbowTimer > cbInterval && dist > 4.0) {
                aiSteveCrossbowTimer = 0;
                shootAICrossbow();
            }

            aiSteveFireworkTimer += delta;
            if (aiSteveFireworkTimer > fireworkCooldown && aiSteveMesh.position.y <= 0.5) {
                aiSteveFireworkTimer = 0;
                aiSteveVerticalVel = botDifficulty === 'hard' ? 22.0 : 18.0; 
                aiSteveIsSmashing = true;
                playSound('firework');
                spawnParticleExplosion(aiSteveMesh.position);
                showActionText("AI STEVE USED FIREWORK BOOST!");
            }

            if (aiSteveMesh.position.y > 0.5 || aiSteveVerticalVel > 0) {
                aiSteveVerticalVel -= 25.0 * delta;
                aiSteveMesh.position.y += aiSteveVerticalVel * delta;

                if (aiSteveMesh.position.y <= 0.5) {
                    aiSteveMesh.position.y = 0.5;
                    aiSteveVerticalVel = 0;

                    const botDist = Math.sqrt(aiSteveMesh.position.x * aiSteveMesh.position.x + aiSteveMesh.position.z * aiSteveMesh.position.z);
                    if (botDist > 34) {
                        const angle = Math.atan2(aiSteveMesh.position.z, aiSteveMesh.position.x);
                        aiSteveMesh.position.x = Math.cos(angle) * 34;
                        aiSteveMesh.position.z = Math.sin(angle) * 34;
                    }

                    if (aiSteveIsSmashing) {
                        aiSteveIsSmashing = false;
                        playSound('mace');
                        spawnParticleExplosion(aiSteveMesh.position);

                        if (dist < 4.0) {
                            const smashDmg = botDifficulty === 'hard' ? 7 : botDifficulty === 'medium' ? 5 : 3;
                            takeDamage(smashDmg);
                            showActionText("AI STEVE LANDED A MACE SMASH ATTACK!");
                        }
                    }
                }
            }

            const parts = aiSteveMesh.userData;
            if (dist > 2.5) {
                const dir = playerPos.clone().sub(aiSteveMesh.position);
                dir.y = 0;
                dir.normalize();

                const nextX = aiSteveMesh.position.x + dir.x * 5.0 * speedMult * delta;
                const nextZ = aiSteveMesh.position.z + dir.z * 5.0 * speedMult * delta;
                const nextDist = Math.sqrt(nextX * nextX + nextZ * nextZ);

                if (nextDist <= 34) {
                    aiSteveMesh.position.x = nextX;
                    aiSteveMesh.position.z = nextZ;
                }

                aiSteveMesh.lookAt(playerPos.x, aiSteveMesh.position.y, playerPos.z);

                aiSteveWalkAnimTimer += delta * 10 * speedMult;
                const swing = Math.sin(aiSteveWalkAnimTimer) * 0.6;
                if (parts.leftLegPivot) parts.leftLegPivot.rotation.x = swing;
                if (parts.rightLegPivot) parts.rightLegPivot.rotation.x = -swing;
                if (parts.leftArmPivot) parts.leftArmPivot.rotation.x = -swing;
                if (parts.rightArmPivot) parts.rightArmPivot.rotation.x = swing;
            } else {
                if (parts.leftLegPivot) parts.leftLegPivot.rotation.x = 0;
                if (parts.rightLegPivot) parts.rightLegPivot.rotation.x = 0;
                if (parts.leftArmPivot) parts.leftArmPivot.rotation.x = 0;
                if (parts.rightArmPivot) parts.rightArmPivot.rotation.x = 0;

                if (dist <= 2.5 && aiSteveMesh.position.y <= 0.5) {
                    aiSteveTimer += delta;
                    if (aiSteveTimer > hitInterval) {
                        aiSteveTimer = 0;
                        playSound('mace');
                        const maceDmg = botDifficulty === 'hard' ? 4 : botDifficulty === 'medium' ? 3 : 2;
                        takeDamage(maceDmg);
                        showActionText("AI Steve Hit You with Mace!");
                    }
                }
            }
        }

            showActionText("Connecting to PeerJS Room: " + roomCode + "...");

            peer = new Peer();

            peer.on('open', () => {
                const conn = peer.connect(hostID);
                
                conn.on('open', () => {
                    peerConn = conn;
                    setupPeerEvents(peerConn);
                    showActionText("Joined Room " + roomCode + " as Client!");
                });

                conn.on('error', () => {
                    startHostingRoom(hostID, roomCode);
                });

                setTimeout(() => {
                    if (!peerConn || !peerConn.open) {
                        peer.destroy();
                        startHostingRoom(hostID, roomCode);
                    }
                }, 2500);
            });

            peer.on('error', () => {
                startHostingRoom(hostID, roomCode);
            });
        }

        function startHostingRoom(hostID, roomCode) {
            peer = new Peer(hostID);

            peer.on('open', () => {
                showActionText("Hosting Room Code: " + roomCode + " (Waiting for Player...)");

                peer.on('connection', (conn) => {
                    peerConn = conn;
                    setupPeerEvents(peerConn);
                    showActionText("Player Joined! Fight Start!");
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    showActionText("Connecting to Host Room " + roomCode + "...");
                    peer = new Peer();
                    peer.on('open', () => {
                        peerConn = peer.connect(hostID);
                        setupPeerEvents(peerConn);
                    });
                }
            });
        }

        function setupPeerEvents(conn) {
            conn.on('open', () => {
                showActionText("Connected! Match Started!");
            });

            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    if (remotePlayerMesh) remotePlayerMesh.position.set(data.x, data.y - PLAYER_EYE_HEIGHT, data.z);
                } else if (data.type === 'obsidian') {
                    placeObsidianBlock(data.x, data.y, data.z);
                } else if (data.type === 'crystal') {
                    placeEndCrystal(data.x, data.y, data.z);
                } else if (data.type === 'damage') {
                    damageRemotePlayer(data.amount);
                    if (remotePlayerMesh) spawnParticleExplosion(remotePlayerMesh.position);
                } else if (data.type === 'hit_me') {
                    takeDamage(data.damage || 3);
                    showActionText("Hit by Enemy Player!");
                }
            });
        }

        function buildColosseumArenaInstanced() {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const radius = 35;

            const sandMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.9 });
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.8 });
            const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7 });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.6 });

            const sandPositions = [];
            for (let x = -radius; x <= radius; x++) {
                for (let z = -radius; z <= radius; z++) {
                    if (x * x + z * z <= radius * radius) {
                        sandPositions.push(new THREE.Vector3(x, 0, z));
                    }
                }
            }

            const sandInstanced = new THREE.InstancedMesh(boxGeo, sandMat, sandPositions.length);
            const dummyMatrix = new THREE.Matrix4();
            sandPositions.forEach((pos, i) => {
                dummyMatrix.setPosition(pos);
                sandInstanced.setMatrixAt(i, dummyMatrix);

                const invisibleMesh = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ visible: false }));
                invisibleMesh.position.copy(pos);
                scene.add(invisibleMesh);
                placeableObjects.push(invisibleMesh);
            });
            sandInstanced.instanceMatrix.needsUpdate = true;
            scene.add(sandInstanced);

            function getRingTransforms(ringRadius, startY, height) {
                const transforms = [];
                const circumference = 2 * Math.PI * ringRadius;
                const steps = Math.ceil(circumference * 1.5);
                for (let i = 0; i < steps; i++) {
                    const angle = (i / steps) * Math.PI * 2;
                    const x = Math.round(Math.cos(angle) * ringRadius);
                    const z = Math.round(Math.sin(angle) * ringRadius);
                    for (let y = 0; y < height; y++) {
                        transforms.push({ x, y: startY + y, z, sx: 1, sy: 1, sz: 1 });
                    }
                }
                return transforms;
            }

            const darkStoneTransforms = getRingTransforms(radius + 1, 1, 4);
            const stoneTransforms = [];

            for (let tier = 0; tier < 8; tier++) {
                const currentRadius = radius + 2 + tier;
                const tierHeight = 4 + tier;
                stoneTransforms.push(...getRingTransforms(currentRadius, tierHeight, 1));
                for (let y = 1; y < tierHeight; y++) {
                    darkStoneTransforms.push(...getRingTransforms(currentRadius, y, 1));
                }
            }

            const pillarRadius = radius + 10;
            const pillarTransforms = [];
            const leafTransforms = [];

            for (let i = 0; i < 24; i++) {
                const angle = (i / 24) * Math.PI * 2;
                const px = Math.cos(angle) * pillarRadius;
                const pz = Math.sin(angle) * pillarRadius;

                for (let ph = 0; ph < 8; ph++) {
                    pillarTransforms.push({ x: px, y: 12 + ph, z: pz, sx: 1.5, sy: 1, sz: 1.5 });
                }
                leafTransforms.push({ x: px * 0.95, y: 12, z: pz * 0.95, sx: 1.5, sy: 1.5, sz: 1.5 });
            }

            stoneTransforms.push(...getRingTransforms(pillarRadius - 1, 20, 1));
            stoneTransforms.push(...getRingTransforms(pillarRadius, 20, 1));
            stoneTransforms.push(...getRingTransforms(pillarRadius + 1, 20, 1));
            const roofTransforms = getRingTransforms(pillarRadius, 21, 1);

            function createBatchMesh(geometry, material, transforms, isSolidWall = false) {
                if (transforms.length === 0) return;
                const instanced = new THREE.InstancedMesh(geometry, material, transforms.length);
                const mat = new THREE.Matrix4();
                const scaleVec = new THREE.Vector3();
                transforms.forEach((t, i) => {
                    scaleVec.set(t.sx || 1, t.sy || 1, t.sz || 1);
                    mat.compose(new THREE.Vector3(t.x, t.y, t.z), new THREE.Quaternion(), scaleVec);
                    instanced.setMatrixAt(i, mat);

                    if (isSolidWall) {
                        const colliderBox = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ visible: false }));
                        colliderBox.position.set(t.x, t.y, t.z);
                        colliderBox.scale.copy(scaleVec);
                        solidColliders.push(colliderBox);
                    }
                });
                instanced.instanceMatrix.needsUpdate = true;
                scene.add(instanced);
            }

            createBatchMesh(boxGeo, darkStoneMat, darkStoneTransforms, true);
            createBatchMesh(boxGeo, stoneMat, stoneTransforms, true);
            createBatchMesh(boxGeo, pillarMat, pillarTransforms, true);
            createBatchMesh(boxGeo, leafMat, leafTransforms, false);
            createBatchMesh(boxGeo, roofMat, roofTransforms, true);
        }

        function setupMobileTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const joystickKnob = document.getElementById('joystick-knob');
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.clientX < window.innerWidth / 2 && touchMoveID === null) {
                        touchMoveID = touch.identifier;
                        updateJoystick(touch);
                    } else if (touch.clientX >= window.innerWidth / 2 && touchLookID === null) {
                        touchLookID = touch.identifier;
                        touchLookLastX = touch.clientX;
                        touchLookLastY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchMoveID) {
                        updateJoystick(touch);
                    } else if (touch.identifier === touchLookID && !isInventoryOpen) {
                        const deltaX = touch.clientX - touchLookLastX;
                        const deltaY = touch.clientY - touchLookLastY;

                        cameraEuler.setFromQuaternion(camera.quaternion);
                        cameraEuler.y -= deltaX * 0.005;
                        cameraEuler.x -= deltaY * 0.005;
                        cameraEuler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraEuler.x));
                        camera.quaternion.setFromEuler(cameraEuler);

                        touchLookLastX = touch.clientX;
                        touchLookLastY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', resetTouches);
            window.addEventListener('touchcancel', resetTouches);

            function resetTouches(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchMoveID) {
                        touchMoveID = null;
                        moveForward = moveBackward = moveLeft = moveRight = false;
                        joystickKnob.style.transform = `translate(0px, 0px)`;
                    } else if (touch.identifier === touchLookID) {
                        touchLookID = null;
                    }
                }
            }

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const dist = Math.min(Math.hypot(dx, dy), 40);
                const angle = Math.atan2(dy, dx);

                const kx = Math.cos(angle) * dist;
                const ky = Math.sin(angle) * dist;
                joystickKnob.style.transform = `translate(${kx}px, ${ky}px)`;

                moveForward = dy < -10;
                moveBackward = dy > 10;
                moveLeft = dx > 10;
                moveRight = dx < -10;
            }

            document.getElementById('btn-inv').addEventListener('touchstart', (e) => {
                e.preventDefault();
                toggleInventory();
            });

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (canJump) { 
                    velocity.y += 11.0; 
                    canJump = false; 
                } else {
                    const activeItem = hotbarData[currentSlot - 1];
                    if (activeItem && activeItem.type === 'firework' && !isGliding) {
                        isGliding = true;
                        showActionText("Elytra Gliding!");
                    }
                }
            });

            document.getElementById('btn-hit').addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleLeftClick();
            });

            document.getElementById('btn-place').addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleRightClick();
            });
        }

        function handleLeftClick() {
            const activeItem = hotbarData[currentSlot - 1];
            const itemType = activeItem ? activeItem.type : '';

            if (itemType === 'sword') swingSwordAnimation();
            else if (itemType === 'arrow') { shootCrossbow(); return; }
            else if (itemType === 'mace') swingMaceAnimation();
            else if (itemType === 'enderpearl') { throwEnderPearl(); return; }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const crystalHits = raycaster.intersectObjects(endCrystals, true);
            if (crystalHits.length > 0) {
                let hitObj = crystalHits[0].object;
                while (hitObj.parent && hitObj.parent !== scene) hitObj = hitObj.parent;
                detonateCrystal(hitObj);
                return;
            }

            const fallDamageBonus = itemType === 'mace' ? Math.max(1, Math.abs(velocity.y) * 0.4) : 1;
            const baseDmg = itemType === 'mace' ? Math.round(5 * fallDamageBonus) : 3;

            if (broPlayerMesh || remotePlayerMesh) {
                const targetBro = broPlayerMesh || remotePlayerMesh;
                const broHits = raycaster.intersectObjects(targetBro.children, true);
                if (broHits.length > 0) {
                    if (gameMode === 'bro') {
                        showActionText(`Hit Brother! (-${baseDmg} HP)`);
                        spawnParticleExplosion(targetBro.position);
                    } else if (gameMode === 'mp') {
                        damageRemotePlayer(baseDmg);
                        if (peerConn && peerConn.open) {
                            peerConn.send({ type: 'hit_me', damage: baseDmg });
                            peerConn.send({ type: 'damage', amount: baseDmg });
                        }
                        showActionText(`Hit Enemy Player! (-${baseDmg} HP)`);
                        spawnParticleExplosion(targetBro.position);
                    }
                    return;
                }
            }

            if (aiSteveMesh) {
                const steveHits = raycaster.intersectObjects(aiSteveMesh.children, true);
                if (steveHits.length > 0) {
                    damageAISteve(baseDmg);
                    return;
                }
            }
        }

        function handleRightClick() {
            const activeItem = hotbarData[currentSlot - 1];
            const itemType = activeItem ? activeItem.type : '';

            if (itemType === 'gapple') { eatGoldenApple(); return; }
            if (itemType === 'firework') { useFireworkBoost(); return; }
            if (itemType === 'enderpearl') { throwEnderPearl(); return; }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(placeableObjects, false);

            if (intersects.length > 0 && intersects[0].distance <= 6.5) {
                const hit = intersects[0];
                const point = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(0.5));
                const gridX = Math.round(point.x);
                const gridY = Math.round(point.y);
                const gridZ = Math.round(point.z);

                if (itemType === 'obsidian' && counts.obsidian > 0) {
                    placeObsidianBlock(gridX, gridY, gridZ);
                    if (peerConn && peerConn.open) peerConn.send({ type: 'obsidian', x: gridX, y: gridY, z: gridZ });
                } else if (itemType === 'crystal' && counts.crystal > 0) {
                    placeEndCrystal(gridX, gridY, gridZ);
                    if (peerConn && peerConn.open) peerConn.send({ type: 'crystal', x: gridX, y: gridY, z: gridZ });
                }
            }
        }

        function placeObsidianBlock(x, y, z) {
            counts.obsidian--;
            playSound('place');

            const obsGeo = new THREE.BoxGeometry(1, 1, 1);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x1a0d2b, roughness: 0.4 });
            const mesh = new THREE.Mesh(obsGeo, obsMat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            placeableObjects.push(mesh);
            solidColliders.push(mesh);
        }

        function placeEndCrystal(x, y, z) {
            counts.crystal--;
            playSound('place');

            const crystal = createEndCrystalMesh();
            crystal.position.set(x, y, z);
            scene.add(crystal);
            endCrystals.push(crystal);
        }

        function detonateCrystal(crystalObj) {
            playSound('explode');
            spawnParticleExplosion(crystalObj.position);

            const index = endCrystals.indexOf(crystalObj);
            if (index > -1) endCrystals.splice(index, 1);
            scene.remove(crystalObj);

            const dist = camera.position.distanceTo(crystalObj.position);
            if (dist < 6.0) {
                const dmg = Math.round((6.0 - dist) * 1.5) + 3;
                takeDamage(dmg);
                showActionText(`BOOM! End Crystal Damage (-${dmg} HP)`);
            }
        }

        function eatGoldenApple() {
            if (counts.gapple <= 0) return;
            counts.gapple--;
            playSound('eat');

            playerHealth = Math.min(maxHealth, playerHealth + 4);
            updateHeartsUI();
            showActionText("Ate Golden Apple (+4 Health)");
        }

        function takeDamage(amount) {
            playerHealth -= amount;
            updateHeartsUI();

            const flash = document.getElementById('flash-overlay');
            flash.style.background = 'rgba(255, 0, 0, 0.4)';
            setTimeout(() => { flash.style.background = 'rgba(255, 0, 0, 0)'; }, 100);

            if (playerHealth <= 0) {
                if (counts.totem > 0) {
                    counts.totem--;
                    playerHealth = maxHealth;
                    updateHeartsUI();
                    playSound('totem');

                    const pop = document.getElementById('totem-pop-overlay');
                    pop.classList.add('active');
                    setTimeout(() => pop.classList.remove('active'), 500);
                    showActionText("TOTEM OF UNDYING SAVED YOU!");
                } else {
                    if (!isMobile) controls.unlock();
                    document.getElementById('death-screen').style.display = 'flex';
                    showActionText("YOU WERE SLAIN BY AI STEVE!");
                }
            }
        }

        function updateHeartsUI() {
            const container = document.getElementById('hearts-container');
            container.innerHTML = '';
            for (let i = 0; i < maxHealth; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'heart-wrapper';
                const heart = document.createElement('div');
                heart.className = 'pixel-heart';
                if (i >= playerHealth) heart.classList.add('empty');
                wrapper.appendChild(heart);
                container.appendChild(wrapper);
            }
        }

        function spawnParticleExplosion(pos) {
            const pCount = 20;
            const pGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

            for (let i = 0; i < pCount; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                scene.add(p);

                const v = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    Math.random() * 10,
                    (Math.random() - 0.5) * 10
                );
                particleSystems.push({ mesh: p, vel: v, life: 0.6 });
            }
        }

        function showActionText(text) {
            const el = document.getElementById('action-text');
            el.innerText = text;
            el.style.opacity = '1';
            clearTimeout(textTimeout);
            textTimeout = setTimeout(() => { el.style.opacity = '0'; }, 2000);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (controls.isLocked || isMobile) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                if (!isGliding) {
                    velocity.y -= 28.0 * delta;
                } else {
                    velocity.y -= 5.0 * delta;
                    velocity.z += 10.0 * delta;
                }

                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();

                const sideDirection = new THREE.Vector3(-direction.z, 0, direction.x);

                let moveSpeed = isGliding ? 25.0 : 12.0;
                if (moveForward) velocity.add(direction.clone().multiplyScalar(moveSpeed * delta * 10));
                if (moveBackward) velocity.add(direction.clone().multiplyScalar(-moveSpeed * delta * 10));
                if (moveLeft) velocity.add(sideDirection.clone().multiplyScalar(moveSpeed * delta * 10));
                if (moveRight) velocity.add(sideDirection.clone().multiplyScalar(-moveSpeed * delta * 10));

                const camObj = controls.getObject();
                const oldPos = camObj.position.clone();

                camObj.position.x += velocity.x * delta;
                camObj.position.z += velocity.z * delta;

                const playerRadius = 0.4;
                const distFromCenter = Math.sqrt(camObj.position.x * camObj.position.x + camObj.position.z * camObj.position.z);
                const arenaRadius = 35;

                const isInVoid = distFromCenter > arenaRadius;

                if (!isInVoid) {
                    for (let i = 0; i < solidColliders.length; i++) {
                        const box = solidColliders[i];
                        const boxPos = box.position;
                        const boxScale = box.scale;

                        const minX = boxPos.x - boxScale.x / 2 - playerRadius;
                        const maxX = boxPos.x + boxScale.x / 2 + playerRadius;
                        const minZ = boxPos.z - boxScale.z / 2 - playerRadius;
                        const maxZ = boxPos.z + boxScale.z / 2 + playerRadius;
                        const minY = boxPos.y - boxScale.y / 2 - PLAYER_EYE_HEIGHT;
                        const maxY = boxPos.y + boxScale.y / 2 + PLAYER_EYE_HEIGHT;

                        if (camObj.position.x > minX && camObj.position.x < maxX &&
                            camObj.position.z > minZ && camObj.position.z < maxZ &&
                            camObj.position.y > minY && camObj.position.y < maxY) {
                            camObj.position.x = oldPos.x;
                            camObj.position.z = oldPos.z;
                            velocity.x = 0;
                            velocity.z = 0;
                            break;
                        }
                    }
                }

                camObj.position.y += velocity.y * delta;

                const floorLimit = isInVoid ? -50.0 : 0.5 + PLAYER_EYE_HEIGHT;

                if (camObj.position.y <= floorLimit) {
                    if (isInVoid) {
                        showActionText("FALLEN INTO THE VOID!");
                        takeDamage(maxHealth);
                        camObj.position.set(0, 15, 0);
                        velocity.set(0, 0, 0);
                        isGliding = false;
                    } else {
                        camObj.position.y = 0.5 + PLAYER_EYE_HEIGHT;
                        velocity.y = 0;
                        canJump = true;
                        isGliding = false;
                    }
                }

                broadcastPlayerPos();
            }

            endCrystals.forEach(c => {
                c.userData.floatOffset += delta * 3;
                c.position.y += Math.sin(c.userData.floatOffset) * 0.003;
                if (c.userData.outerCrystal) {
                    c.userData.outerCrystal.rotation.y += delta;
                }
            });

            for (let i = activeArrows.length - 1; i >= 0; i--) {
                const arr = activeArrows[i];
                arr.mesh.position.add(arr.dir.clone().multiplyScalar(delta));
                arr.age += delta;

                if (arr.age > 3.0) {
                    scene.remove(arr.mesh);
                    activeArrows.splice(i, 1);
                }
            }

            for (let i = activeEnderPearls.length - 1; i >= 0; i--) {
                const pearl = activeEnderPearls[i];
                pearl.mesh.position.add(pearl.velocity.clone().multiplyScalar(delta));
                pearl.velocity.y -= 20.0 * delta;
                pearl.age += delta;

                if (pearl.mesh.position.y <= 0.5 || pearl.age > 4.0) {
                    controls.getObject().position.copy(pearl.mesh.position).add(new THREE.Vector3(0, PLAYER_EYE_HEIGHT, 0));
                    scene.remove(pearl.mesh);
                    activeEnderPearls.splice(i, 1);
                    playSound('explode');
                    spawnParticleExplosion(controls.getObject().position);
                    showActionText("Ender Pearl Teleport!");
                }
            }

            for (let i = particleSystems.length - 1; i >= 0; i--) {
                const p = particleSystems[i];
                p.mesh.position.add(p.vel.clone().multiplyScalar(delta));
                p.life -= delta;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particleSystems.splice(i, 1);
                }
            }

            if (aiSteveMesh) updateAISteveLogic(delta);
            if (broPlayerMesh && broPlayerMesh.position.y > 0.5) {
                broPlayerMesh.position.y -= 9.8 * delta;
                if (broPlayerMesh.position.y < 0.5) broPlayerMesh.position.y = 0.5;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
