<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donut SMP - End Crystal PvP</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      margin-left: -5px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      pointer-events: none;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- PointerLockControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">Click anywhere to start & walk on floor</div>

  <script>
    // --- 1. SCENE, CAMERA, & RENDERER SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec0ee); // Sky color

    const camera = new THREE.PerspectiveCamera(
      75, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // --- 2. ARENA & FLOOR SETUP ---
    const FLOOR_Y = 0;
    
    // Arena Floor
    const floorGeometry = new THREE.PlaneGeometry(100, 100);
    const floorMaterial = new THREE.MeshLambertMaterial({ color: 0xd2b48c }); // Sand/floor color
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2; // Lie flat horizontally
    floor.position.y = FLOOR_Y;
    scene.add(floor);

    // --- 3. CONTROLS & PLAYER CONSTANTS ---
    const controls = new THREE.PointerLockControls(camera, document.body);

    const PLAYER_EYE_HEIGHT = 1.6; // Stand height above floor
    const GRAVITY = 30.0;
    const MOVE_SPEED = 12.0;
    const JUMP_STRENGTH = 10.0;

    // Set initial spawn directly on floor level
    camera.position.set(0, FLOOR_Y + PLAYER_EYE_HEIGHT, 15);

    // Click page to activate pointer lock controls
    document.addEventListener('click', () => {
      controls.lock();
    });

    // --- 4. MOVEMENT & INPUT HANDLING ---
    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;
    let canJump = false;

    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    const onKeyDown = function (event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = true; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
        case 'KeyS': case 'ArrowDown': moveBackward = true; break;
        case 'KeyD': case 'ArrowRight': moveRight = true; break;
        case 'Space':
          if (canJump === true) velocity.y += JUMP_STRENGTH;
          canJump = false;
          break;
      }
    };

    const onKeyUp = function (event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = false; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
        case 'KeyS': case 'ArrowDown': moveBackward = false; break;
        case 'KeyD': case 'ArrowRight': moveRight = false; break;
      }
    };

    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);

    // --- 5. ANIMATION LOOP & PHYSICS ---
    let prevTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000; // Time step in seconds

      if (controls.isLocked === true) {
        // Friction / slowdown
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        // Apply gravity
        velocity.y -= GRAVITY * delta;

        // Determine move direction relative to camera facing
        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * MOVE_SPEED * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * MOVE_SPEED * delta;

        // Move camera horizontally
        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        // Apply vertical movement (jumping/falling)
        camera.position.y += velocity.y * delta;

        // --- GROUND COLLISION CHECK ---
        if (camera.position.y < FLOOR_Y + PLAYER_EYE_HEIGHT) {
          velocity.y = 0;
          camera.position.y = FLOOR_Y + PLAYER_EYE_HEIGHT; // Snap to ground
          canJump = true;
        }
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
