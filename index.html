<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Hotbar Demo</title>
    <!-- Import Minecraft pixel font -->
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    <style>
        body {
            background-color: #333;
            font-family: 'Minecraft', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 90vh;
            margin: 0;
        }

        /* Hotbar Container */
        #hotbar {
            display: flex;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px;
            border: 4px solid #222;
            border-radius: 4px;
        }

        /* Inventory Slots */
        .slot {
            width: 50px;
            height: 50px;
            background-color: rgba(139, 139, 139, 0.5);
            border: 3px solid #373737;
            margin: 0 2px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Active / Selected Slot Highlight */
        .slot.selected {
            border-color: #fff;
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Item Image */
        .slot img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        /* Quantity Count Badge */
        .count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 0px #000; /* Minecraft drop-shadow text effect */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Hotbar UI -->
    <div id="hotbar"></div>

    <script>
        // 1. Define your inventory data (9 hotbar slots)
        let inventory = [
            { name: "Sword", count: 1, icon: "https://api.iconify.design/game-icons:broadsword.svg" },
            { name: "Wood", count: 63, icon: "https://api.iconify.design/game-icons:wood-pile.svg" },
            { name: "Potion", count: 47, icon: "https://api.iconify.design/game-icons:magic-swirl.svg" },
            null, // Empty slot
            { name: "Stone", count: 3, icon: "https://api.iconify.design/game-icons:moai.svg" },
            { name: "Bow", count: 30, icon: "https://api.iconify.design/game-icons:bow-arrow.svg" },
            { name: "Rocket", count: 27, icon: "https://api.iconify.design/game-icons:rocket.svg" },
            { name: "Hammer", count: 64, icon: "https://api.iconify.design/game-icons:hammer-drop.svg" },
            { name: "Orb", count: 31, icon: "https://api.iconify.design/game-icons:crystal-ball.svg" }
        ];

        let selectedSlot = 6; // Index 6 matches your 7th hotbar slot (1-indexed display)

        const hotbarEl = document.getElementById('hotbar');

        // 2. Function to render the hotbar onto the screen
        function renderHotbar() {
            hotbarEl.innerHTML = '';
            
            inventory.forEach((item, index) => {
                const slotDiv = document.createElement('div');
                slotDiv.classList.add('slot');
                
                if (index === selectedSlot) {
                    slotDiv.classList.add('selected');
                }

                if (item) {
                    // Add item icon
                    const img = document.createElement('img');
                    img.src = item.icon;
                    slotDiv.appendChild(img);

                    // Add quantity text if count > 1 (or always show like Minecraft hotbar)
                    if (item.count > 0) {
                        const countSpan = document.createElement('span');
                        countSpan.classList.add('count');
                        countSpan.innerText = item.count;
                        slotDiv.appendChild(countSpan);
                    }
                }

                hotbarEl.appendChild(slotDiv);
            });
        }

        // 3. Function triggered when the player uses the item in their hand
        function useSelectedItem() {
            let currentItem = inventory[selectedSlot];

            if (currentItem && currentItem.count > 0) {
                // Decrease the count by 1
                currentItem.count -= 1;

                // If count drops to 0 or below, clear out the slot
                if (currentItem.count <= 0) {
                    inventory[selectedSlot] = null;
                }

                // Refresh the visual UI
                renderHotbar();
            } else {
                console.log("Slot is empty!");
            }
        }

        // Listen for a click anywhere on the page to simulate "using" the item
        window.addEventListener('mousedown', () => {
            useSelectedItem();
        });

        // Initial render on load
        renderHotbar();
    </script>
</body>
</html>
