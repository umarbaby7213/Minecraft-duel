<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Donut SMP - End Crystal PvP</title>
    <!-- Import Minecraft pixel font -->
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Minecraft', 'Courier New', Courier, monospace; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 2px #000; }
        #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
        #crosshair::after { left: 0; top: 7px; width: 16px; height: 2px; }
        
        /* Flash Overlays */
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0); pointer-events: none; z-index: 4; transition: background 0.05s ease-out; }
        
        /* Totem Pop Overlay */
        #totem-pop-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            pointer-events: none; z-index: 8; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            font-size: 130px; text-shadow: 0 0 20px #ffaa00;
        }
        #totem-pop-overlay.active { transform: translate(-50%, -50%) scale(1.4); }

        /* YOU DIED Death Screen Overlay */
        #death-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(170, 0, 0, 0.5); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 25; pointer-events: auto;
            backdrop-filter: blur(2px);
        }
        #death-screen h1 {
            color: #ff0000; font-size: 64px; text-shadow: 4px 4px #3f0000, -2px -2px #000;
            font-family: 'Minecraft', 'Courier New', monospace; font-weight: bold; margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #death-screen p {
            color: #ffffff; font-size: 20px; text-shadow: 2px 2px #000; margin-bottom: 25px;
            font-family: 'Minecraft', 'Courier New', monospace;
        }
        .death-btn {
            padding: 12px 30px; background: #555555; color: #ffffff; border: 2px solid #ffffff;
            font-family: 'Minecraft', 'Courier New', monospace; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 3px 3px 0 #000;
        }
        .death-btn:hover { background: #777777; }

        /* HUD Container */
        #hud { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 7; }
        
        /* Hearts & Food Row */
        .status-wrapper { display: flex; justify-content: space-between; width: 100%; margin-bottom: 6px; gap: 10px; }
        .hearts-bar, .food-bar { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 4px; border: 2px solid #3c3c3c; }
        .heart-wrapper, .shank-wrapper { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        
        /* Pixel Art Icons */
        .pixel-heart {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                2px 0px 0 #000, 3px 0px 0 #000, 6px 0px 0 #000, 7px 0px 0 #000,
                1px 1px 0 #000, 2px 1px 0 #e02424, 3px 1px 0 #ff6b6b, 4px 1px 0 #000, 5px 1px 0 #000, 6px 1px 0 #e02424, 7px 1px 0 #e02424, 8px 1px 0 #000,
                0px 2px 0 #000, 1px 2px 0 #ffffff, 2px 2px 0 #ff6b6b, 3px 2px 0 #e02424, 4px 2px 0 #e02424, 5px 2px 0 #e02424, 6px 2px 0 #e02424, 7px 2px 0 #9c0000, 8px 2px 0 #000,
                0px 3px 0 #000, 1px 3px 0 #ff6b6b, 2px 3px 0 #e02424, 3px 3px 0 #e02424, 4px 3px 0 #e02424, 5px 3px 0 #e02424, 6px 3px 0 #e02424, 7px 3px 0 #9c0000, 8px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #e02424, 2px 4px 0 #e02424, 3px 4px 0 #e02424, 4px 4px 0 #e02424, 5px 4px 0 #e02424, 6px 4px 0 #e02424, 7px 4px 0 #9c0000, 8px 4px 0 #000,
                1px 5px 0 #000, 2px 5px 0 #e02424, 3px 5px 0 #e02424, 4px 5px 0 #e02424, 5px 5px 0 #e02424, 6px 5px 0 #9c0000, 7px 5px 0 #000,
                2px 6px 0 #000, 3px 6px 0 #e02424, 4px 6px 0 #e02424, 5px 6px 0 #9c0000, 6px 6px 0 #000,
                3px 7px 0 #000, 4px 7px 0 #e02424, 5px 7px 0 #000, 4px 8px 0 #000;
            transform: scale(1.6); transition: opacity 0.2s;
        }
        .pixel-heart.empty { opacity: 0.2; }

        .pixel-shank {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                4px 0px 0 #000, 5px 0px 0 #000,
                3px 1px 0 #000, 4px 1px 0 #d1a880, 5px 1px 0 #bd6328, 6px 1px 0 #000,
                2px 2px 0 #000, 3px 2px 0 #d1a880, 4px 2px 0 #bd6328, 5px 2px 0 #8b3a0f, 6px 2px 0 #000,
                1px 3px 0 #000, 2px 3px 0 #bd6328, 3px 3px 0 #bd6328, 4px 3px 0 #8b3a0f, 5px 3px 0 #5c2204, 6px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #bd6328, 2px 4px 0 #8b3a0f, 3px 4px 0 #8b3a0f, 4px 4px 0 #5c2204, 5px 4px 0 #000,
                0px 5px 0 #000, 1px 5px 0 #8b3a0f, 2px 5px 0 #8b3a0f, 3px 5px 0 #000,
                0px 6px 0 #000, 1px 6px 0 #d1a880, 2px 6px 0 #000,
                1px 7px 0 #000, 2px 7px 0 #ffffff, 3px 7px 0 #000, 2px 8px 0 #000;
            transform: scale(1.6);
        }

        .pixel-gapple {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                4px 0px 0 #5c2204, 5px 0px 0 #5c2204, 4px 1px 0 #5c2204,
                2px 2px 0 #000, 3px 2px 0 #000, 6px 2px 0 #000, 7px 2px 0 #000,
                1px 3px 0 #000, 2px 3px 0 #fff3a1, 3px 3px 0 #ffd700, 4px 3px 0 #000, 5px 3px 0 #000, 6px 3px 0 #ffd700, 7px 3px 0 #ffd700, 8px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #ffffff, 2px 4px 0 #ffd700, 3px 4px 0 #ffaa00, 4px 4px 0 #ffaa00, 5px 4px 0 #ffaa00, 6px 4px 0 #ffaa00, 7px 4px 0 #c77b00, 8px 4px 0 #000,
                0px 5px 0 #000, 1px 5px 0 #ffd700, 2px 5px 0 #ffaa00, 3px 5px 0 #ffaa00, 4px 5px 0 #ffaa00, 5px 5px 0 #ffaa00, 6px 5px 0 #ffaa00, 7px 5px 0 #c77b00, 8px 5px 0 #000,
                0px 6px 0 #000, 1px 6px 0 #ffaa00, 2px 6px 0 #ffaa00, 3px 6px 0 #ffaa00, 4px 6px 0 #ffaa00, 5px 6px 0 #ffaa00, 6px 6px 0 #ffaa00, 7px 6px 0 #c77b00, 8px 6px 0 #000,
                1px 7px 0 #000, 2px 7px 0 #ffaa00, 3px 7px 0 #ffaa00, 4px 7px 0 #ffaa00, 5px 7px 0 #ffaa00, 6px 7px 0 #c77b00, 7px 7px 0 #000,
                2px 8px 0 #000, 3px 8px 0 #ffaa00, 4px 8px 0 #ffaa00, 5px 8px 0 #c77b00, 6px 8px 0 #000,
                3px 9px 0 #000, 4px 9px 0 #ffaa00, 5px 9px 0 #000, 4px 10px 0 #000;
            transform: scale(1.5);
        }

        /* Inventory & Hotbar UI */
        #hotbar-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: auto; }
        #hotbar { display: flex; background: rgba(0, 0, 0, 0.7); border: 3px solid #3c3c3c; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .slot { width: 42px; height: 42px; border: 2px solid #8b8b8b; background: rgba(139, 139, 139, 0.3); margin: 2px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 16px; position: relative; cursor: pointer; }
        .slot.active { border-color: #ffffff; background: rgba(255, 255, 255, 0.4); box-shadow: inset 0 0 8px #fff; }
        .slot.selected-swap { border-color: #ffcc00; background: rgba(255, 204, 0, 0.4); animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { from { box-shadow: inset 0 0 4px #ffcc00; } to { box-shadow: inset 0 0 12px #ffcc00; } }
        .slot-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: #aaa; font-weight: bold; }
        .count-badge { position: absolute; bottom: 1px; right: 2px; font-size: 9px; color: #fff; font-weight: bold; text-shadow: 1px 1px #000; }

        /* Full Inventory GUI Screen (Opened with 'E') */
        #inventory-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 380px; background: #c6c6c6; border: 4px solid #373737; border-radius: 6px;
            padding: 15px; display: none; flex-direction: column; gap: 10px; z-index: 20;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8); pointer-events: auto;
        }
        #inventory-screen h3 { color: #373737; font-size: 15px; margin-bottom: 5px; text-align: center; font-weight: bold; font-family: 'Minecraft', monospace; }
        .inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #8b8b8b; padding: 6px; border: 3px solid #373737; }
        .inv-slot { width: 34px; height: 34px; background: #8b8b8b; border: 2px solid #373737; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; position: relative; }
        .inv-slot:hover { background: #aaaaaa; }
        .inv-slot.selected-swap { border-color: #ffcc00; background: #d4af37; }

        /* Mobile Controls Overlays */
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; z-index: 6; display: none; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; }
        
        #mobile-buttons { position: absolute; bottom: 20px; right: 20px; display: none; flex-direction: column; gap: 8px; z-index: 6; }
        .mobile-btn { width: 54px; height: 54px; background: rgba(0, 0, 0, 0.6); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 12px; font-weight: bold; display: flex; justify-content: center; align-items: center; text-align: center; }
        .mobile-btn:active { background: rgba(255, 255, 255, 0.4); }

        /* Action Text Overlay */
        #action-text { position: absolute; top: 60%; left: 50%; transform: translateX(-50%); color: #ffeb3b; font-size: 16px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5; text-align: center; }

        /* Settings Options UI */
        .option-group { display: flex; flex-direction: column; gap: 4px; text-align: left; margin-bottom: 8px; }
        .option-group label { color: #aaa; font-size: 12px; font-weight: bold; }
        .option-select, .option-input { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #ffaa00; border-radius: 4px; font-family: inherit; font-size: 13px; }

        /* Start Screen Blocker */
        #blocker { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 30; }
        #instructions { text-align: center; padding: 25px; background: rgba(20, 20, 20, 0.95); border: 3px solid #ff0055; box-shadow: 0 0 30px #ff0055; border-radius: 8px; max-width: 90%; width: 480px; max-height: 90vh; overflow-y: auto; }
        .mode-btn { margin: 8px 0; padding: 12px; width: 100%; background: #ff0055; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; }
        .mode-btn:hover { background: #ff3377; }
        #room-input { width: 100%; padding: 10px; margin: 8px 0; text-align: center; font-size: 18px; border-radius: 5px; border: 2px solid #ffaa00; background: #222; color: #fff; font-family: inherit; }
        
        /* Multiplayer Buttons Group */
        .mp-btn-container { display: flex; gap: 10px; width: 100%; }
        .mp-btn { flex: 1; margin: 4px 0; padding: 10px; color: #fff; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
    </style>
    <!-- Three.js, PointerLockControls & PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="crosshair"></div>
        <div id="flash-overlay"></div>
        <div id="totem-pop-overlay">🗿</div>
        <div id="action-text">Void Island Arena Created!</div>

        <!-- Minecraft Style "YOU DIED" Overlay -->
        <div id="death-screen">
            <h1>You Died!</h1>
            <p id="death-msg">You fell into the void!</p>
            <button class="death-btn" onclick="respawnPlayer()">Respawn</button>
        </div>

        <!-- Touch Joysticks & Buttons -->
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="mobile-buttons">
            <div class="mobile-btn" id="btn-inv" style="border-color:#ffaa00;">INV</div>
            <div class="mobile-btn" id="btn-jump">JUMP</div>
            <div class="mobile-btn" id="btn-hit" style="border-color:#ff5555;">HIT</div>
            <div class="mobile-btn" id="btn-place" style="border-color:#55ff55;">PLACE</div>
        </div>

        <!-- Full Inventory GUI Screen -->
        <div id="inventory-screen">
            <h3>INVENTORY (Click 2 items to Swap)</h3>
            <div class="inv-grid" id="inv-grid-container"></div>
            <p style="font-size: 10px; color: #333; text-align: center; margin-top: 5px; font-family: 'Minecraft', monospace;">
                Click any slot then another to SWAP items! Press 1-9 on hotbar to swap instantly!
            </p>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="status-wrapper">
                <div class="hearts-bar" id="hearts-container">
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                </div>
                <div class="food-bar">
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                </div>
            </div>

            <!-- Hotbar (9 Slots) -->
            <div id="hotbar-wrapper">
                <div id="hotbar"></div>
            </div>
        </div>

        <!-- Start Overlay -->
        <div id="blocker">
            <div id="instructions">
                <h1 style="color:#ff0055; margin-bottom:10px; font-size: 22px;">DONUT SMP CRYSTAL PVP (VOID ARENA)</h1>
                
                <div style="background: #111; padding: 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #333;">
                    <div class="option-group">
                        <label>BOT DIFFICULTY (FOR VS AI BOT)</label>
                        <select id="bot-difficulty-select" class="option-select">
                            <option value="easy">Easy Mode</option>
                            <option value="medium" selected>Medium Mode</option>
                            <option value="hard">Hard Mode</option>
                        </select>
                    </div>

                    <div class="option-group">
                        <label>FIELD OF VIEW (FOV)</label>
                        <select id="fov-select" class="option-select">
                            <option value="60">60° (Narrow)</option>
                            <option value="75" selected>75° (Standard)</option>
                            <option value="90">90° (Quake Pro / Wide)</option>
                            <option value="110">110° (Ultra Wide)</option>
                        </select>
                    </div>
                </div>

                <p style="color:#ffaa00; font-weight:bold; margin-bottom:12px; font-size: 15px;">Choose Mode to Play:</p>
                
                <button class="mode-btn" id="btn-mode-ai">1. PLAY VS UPGRADED STEVE AI BOT</button>
                <button class="mode-btn" id="btn-mode-bro" style="background:#aa00ff;">2. PLAY ON SINGLE DEVICE (2P DUEL)</button>
                
                <hr style="margin:10px 0; border:1px solid #444;">
                
                <input type="number" id="room-input" placeholder="Enter Room Code (e.g. 1234)" />
                <div class="mp-btn-container">
                    <button class="mp-btn" id="btn-join-mp" style="background:#0077ff; width:100%;">JOIN / HOST ROOM</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, raycaster;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        let prevTime = performance.now();

        // Eye-level player height above floor
        const PLAYER_EYE_HEIGHT = 1.6;

        let botDifficulty = 'medium';
        let isMobile = false;
        let touchLookID = null, touchMoveID = null;
        let touchLookLastX = 0, touchLookLastY = 0;
        let joystickCenter = { x: 0, y: 0 };
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');

        let currentSlot = 1; 
        let playerHealth = 10;
        const maxHealth = 10;
        let playerTotems = 64;
        let isDead = false;
        let swapSourceIndex = null; // For inventory item swapping

        let textTimeout = null;
        let isInventoryOpen = false;

        // Inventory Items State (Hotbar slots 0..8, Inventory slots 9..26)
        const ITEM_TYPES = {
            sword: { name: 'Sword', icon: '🗡️' },
            gapple: { name: 'Gapple', icon: '<div class="pixel-gapple"></div>' },
            crystal: { name: 'Crystal', icon: '🔮' },
            obsidian: { name: 'Obsidian', icon: '⬛' },
            totem: { name: 'Totem', icon: '🗿' },
            arrow: { name: 'Arrow', icon: '🏹' },
            firework: { name: 'Firework', icon: '🚀' },
            mace: { name: 'Mace', icon: '🔨' },
            enderpearl: { name: 'Ender Pearl', icon: '🟣' }
        };

        // 27 Total slots (0-8: Hotbar, 9-26: Main Inventory) - Barrels removed!
        let inventorySlots = [
            // Default Hotbar (0 to 8)
            { type: 'sword', count: 1 },
            { type: 'gapple', count: 64 },
            { type: 'crystal', count: 64 },
            { type: 'obsidian', count: 64 },
            { type: 'totem', count: 64 },
            { type: 'arrow', count: 64 },
            { type: 'firework', count: 64 },
            { type: 'mace', count: 64 },
            { type: 'enderpearl', count: 64 },
            // Extra Inventory (9 to 26)
            { type: 'enderpearl', count: 64 }, { type: 'mace', count: 64 }, { type: 'crystal', count: 64 },
            { type: 'obsidian', count: 64 }, { type: 'totem', count: 64 }, { type: 'gapple', count: 64 },
            { type: 'arrow', count: 64 }, { type: 'firework', count: 64 }, { type: 'sword', count: 1 },
            { type: 'crystal', count: 64 }, { type: 'obsidian', count: 64 }, { type: 'totem', count: 64 },
            { type: 'gapple', count: 64 }, { type: 'arrow', count: 64 }, { type: 'firework', count: 64 },
            { type: 'enderpearl', count: 64 }, { type: 'mace', count: 64 }, { type: 'crystal', count: 64 }
        ];

        let isGliding = false;
        let gameMode = 'none';
        let peer = null, peerConn = null;
        let remotePlayerMesh = null;
        let broPlayerMesh = null;
        let remotePlayerHealth = 10;
        let remotePlayerTotems = 64;
        let remotePlayerHealthBarMesh = null;
        
        let aiSteveMesh = null, aiSteveTimer = 0, aiSteveFireworkTimer = 0, aiSteveCrossbowTimer = 0;
        let aiSteveHealth = 10;
        let aiSteveTotems = 64;
        let aiSteveHealthBarMesh = null;
        let aiSteveVerticalVel = 0;
        let aiSteveIsSmashing = false;
        let aiSteveWalkAnimTimer = 0;

        let swordMesh, heldTotemMesh, crossbowMesh, maceMesh, enderpearlMesh, obsidianMesh;

        const activeArrows = [];
        const activeEnderPearls = [];
        const placeableObjects = [];
        const solidColliders = []; 
        const endCrystals = [];
        const dummyTargets = [];
        const particleSystems = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'explode') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.6);
                gain.gain.setValueAtTime(1.0, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'mace') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                gain.gain.setValueAtTime(0.9, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'shoot' || type === 'pearl') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(type === 'pearl' ? 450 : 600, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'firework') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'place') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'sword') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'totem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        function detectMobile() { return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0); }

        function init() {
            isMobile = detectMobile();

            scene = new THREE.Scene();
            // Dark End-Sky / Void background
            scene.background = new THREE.Color(0x0b0813);
            scene.fog = new THREE.FogExp2(0x0b0813, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            raycaster = new THREE.Raycaster();

            const ambientLight = new THREE.AmbientLight(0x8877aa, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffddaa, 1.0);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            document.getElementById('bot-difficulty-select').addEventListener('change', (e) => {
                botDifficulty = e.target.value;
            });

            document.getElementById('fov-select').addEventListener('change', (e) => {
                camera.fov = parseFloat(e.target.value);
                camera.updateProjectionMatrix();
            });

            document.getElementById('btn-mode-ai').addEventListener('click', () => {
                gameMode = 'ai';
                startGame();
                spawnAISteve();
            });

            document.getElementById('btn-mode-bro').addEventListener('click', () => {
                gameMode = 'bro';
                startGame();
                spawnBrotherPlayer();
            });

            document.getElementById('btn-join-mp').addEventListener('click', () => {
                const roomCode = document.getElementById('room-input').value.trim();
                if (!roomCode || roomCode.length < 2) {
                    alert('Please enter a valid room code (e.g. 1234)!');
                    return;
                }
                gameMode = 'mp';
                startGame();
                initMultiplayer(roomCode);
            });

            scene.add(controls.getObject());
            controls.getObject().position.set(0, 0.5 + PLAYER_EYE_HEIGHT, 0);

            buildVoidIslandArena();
            buildHeldItemModels();
            spawnDummyTargets();
            setupControls();
            setupMouseInteraction();
            renderHotbarUI();
            renderInventoryGUI();

            if (isMobile) setupMobileTouchControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function startGame() {
            document.getElementById('blocker').style.display = 'none';
            if (!isMobile) {
                controls.lock();
            } else {
                document.getElementById('joystick-zone').style.display = 'block';
                document.getElementById('mobile-buttons').style.display = 'flex';
            }
        }

        /* Inventory & Hotbar Slot Management */
        function renderHotbarUI() {
            const hotbarEl = document.getElementById('hotbar');
            hotbarEl.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                const item = inventorySlots[i];
                const slotDiv = document.createElement('div');
                slotDiv.className = `slot ${i + 1 === currentSlot ? 'active' : ''} ${swapSourceIndex === i ? 'selected-swap' : ''}`;
                slotDiv.id = `slot-${i + 1}`;
                
                let iconHtml = '';
                let countHtml = '';
                if (item && item.type) {
                    const info = ITEM_TYPES[item.type];
                    iconHtml = info ? info.icon : '';
                    if (item.count > 1) {
                        countHtml = `<span class="count-badge">${item.count}</span>`;
                    }
                }

                slotDiv.innerHTML = `<span class="slot-num">${i + 1}</span>${iconHtml}${countHtml}`;
                slotDiv.onclick = (e) => {
                    e.stopPropagation();
                    if (isInventoryOpen && swapSourceIndex !== null) {
                        swapSlots(swapSourceIndex, i);
                    } else {
                        selectSlot(i + 1);
                    }
                };
                hotbarEl.appendChild(slotDiv);
            }
            updateHeldItemVisibility();
        }

        function renderInventoryGUI() {
            const container = document.getElementById('inv-grid-container');
            container.innerHTML = '';

            // Main Inventory (Slots 9..26)
            for (let i = 9; i < 27; i++) {
                const item = inventorySlots[i];
                const slot = document.createElement('div');
                slot.className = `inv-slot ${swapSourceIndex === i ? 'selected-swap' : ''}`;
                
                let iconHtml = '';
                let countHtml = '';
                if (item && item.type) {
                    const info = ITEM_TYPES[item.type];
                    iconHtml = info ? info.icon : '';
                    if (item.count > 1) {
                        countHtml = `<span class="count-badge">${item.count}</span>`;
                    }
                }

                slot.innerHTML = `${iconHtml}${countHtml}`;
                slot.onclick = () => handleSlotClick(i);
                container.appendChild(slot);
            }
        }

        function handleSlotClick(index) {
            if (swapSourceIndex === null) {
                swapSourceIndex = index;
                showActionText(`Selected ${getItemName(index)} to Swap! Click target slot.`);
            } else {
                swapSlots(swapSourceIndex, index);
            }
            renderHotbarUI();
            renderInventoryGUI();
        }

        function swapSlots(idx1, idx2) {
            const temp = inventorySlots[idx1];
            inventorySlots[idx1] = inventorySlots[idx2];
            inventorySlots[idx2] = temp;

            showActionText(`Swapped Items!`);
            swapSourceIndex = null;
            renderHotbarUI();
            renderInventoryGUI();
        }

        function getItemName(index) {
            const item = inventorySlots[index];
            if (!item || !item.type || !ITEM_TYPES[item.type]) return 'Empty Slot';
            return ITEM_TYPES[item.type].name;
        }

        function toggleInventory() {
            isInventoryOpen = !isInventoryOpen;
            const invScreen = document.getElementById('inventory-screen');
            if (isInventoryOpen) {
                invScreen.style.display = 'flex';
                if (!isMobile) controls.unlock();
            } else {
                invScreen.style.display = 'none';
                swapSourceIndex = null;
                renderHotbarUI();
                renderInventoryGUI();
                if (!isMobile) controls.lock();
            }
        }

        /* Player Death & Respawn Logic */
        function triggerDeath(killerName = "Enemy") {
            if (isDead) return;
            isDead = true;
            playSound('explode');

            document.getElementById('death-msg').innerText = killerName === "The Void" ? "You fell into the void!" : `You were slain by ${killerName}!`;
            document.getElementById('death-screen').style.display = 'flex';

            if (!isMobile) controls.unlock();

            // Notify Peer JS client if in multiplayer mode
            if (gameMode === 'mp' && peerConn && peerConn.open) {
                peerConn.send({ type: 'died' });
            }
        }

        function respawnPlayer() {
            isDead = false;
            playerHealth = maxHealth;
            updateHeartsUI();
            document.getElementById('death-screen').style.display = 'none';

            // Reset player position to spawn arena center
            controls.getObject().position.set(0, 0.5 + PLAYER_EYE_HEIGHT, 0);
            velocity.set(0, 0, 0);

            // Refill items
            inventorySlots.forEach(s => { if (s && s.type !== 'sword') s.count = 64; });
            renderHotbarUI();

            if (!isMobile) controls.lock();
            showActionText("Respawned! Ready for Battle!");
        }

            const legGeo = new THREE.BoxGeometry(0.38, 0.6, 0.38);
            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.y = -0.3;
            leftLegPivot.add(leftLeg);
            steveGroup.add(leftLegPivot);

            // Right Leg Pivot
            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(0.2, 0.6, 0);
            const rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.y = -0.3;
            rightLegPivot.add(rightLeg);
            steveGroup.add(rightLegPivot);

            // Left Arm Pivot
            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(-0.58, 1.4, 0);
            const armGeo = new THREE.BoxGeometry(0.36, 0.8, 0.36);
            const leftArm = new THREE.Mesh(armGeo, shirtMat);
            leftArm.position.y = -0.4;
            leftArmPivot.add(leftArm);
            steveGroup.add(leftArmPivot);

            // Right Arm Pivot
            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.58, 1.4, 0);

            rightArm.position.y = -0.4;
            rightArmPivot.add(rightArm);

            if (isBot) {
                // Elytra Wings
                const wingGeo = new THREE.BoxGeometry(0.1, 0.9, 0.4);
                const wingMat = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.3 });
                
                const leftWing = new THREE.Mesh(wingGeo, wingMat);
                leftWing.position.set(-0.25, 1.05, -0.25);
                leftWing.rotation.set(0.2, 0.3, 0.4);
                steveGroup.add(leftWing);

                const rightWing = new THREE.Mesh(wingGeo, wingMat);
                rightWing.position.set(0.25, 1.05, -0.25);
                rightWing.rotation.set(0.2, -0.3, -0.4);
                steveGroup.add(rightWing);

                // Held Mace attached to Right Arm
                const botMace = new THREE.Group();
                const handleGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.8);
                const handleMat = new THREE.MeshStandardMaterial({ color: 0x3a2512 });

        function takeDamage(amount, attackerName = "Enemy") {
            if (isDead) return;
            playerHealth -= amount;

            const flash = document.getElementById('flash-overlay');
            flash.style.background = 'rgba(255, 0, 0, 0.4)';
            setTimeout(() => { flash.style.background = 'rgba(255, 0, 0)'; }, 100);

            if (playerHealth <= 0) {
                let totemSlotIndex = inventorySlots.findIndex(s => s && s.type === 'totem' && s.count > 0);
                if (totemSlotIndex !== -1 && attackerName !== "The Void") {
                    inventorySlots[totemSlotIndex].count--;

                        inventorySlots[totemSlotIndex] = { type: null, count: 0 };

                    playerHealth = maxHealth;
                    playSound('totem');

                    const totemOverlay = document.getElementById('totem-pop-overlay');
                    totemOverlay.classList.add('active');
                    setTimeout(() => totemOverlay.classList.remove('active'), 1000);

                    showActionText("TOTEM POPPED! SAVED FROM DEATH!");

        function shootAICrossbow() {

            const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

            const speed = botDifficulty === 'hard' ? 55.0 : botDifficulty === 'medium' ? 38.0 : 25.0;
            activeArrows.push({ mesh: arrowMesh, dir: dir.multiplyScalar(speed), age: 0, isFromBot: true });

        function updateAISteveLogic(delta) {
            if (!aiSteveMesh) return;
            
            // Check if AI Steve fell into the void
            if (aiSteveMesh.position.y < -15) {
                showActionText("AI STEVE FELL INTO THE VOID!");
                scene.remove(aiSteveMesh);
                aiSteveMesh = null;
                setTimeout(() => {
                    if (gameMode === 'ai') {
                        aiSteveTotems = 64;
                        aiSteveHealth = maxHealth;
                        spawnAISteve();
                    }
                }, 3000);
                return;
            }

            if (aiSteveHealthBarMesh) aiSteveHealthBarMesh.lookAt(camera.position);

            const playerPos = camera.position;
            const dist = aiSteveMesh.position.distanceTo(playerPos);

            let speedMult = 1.0, hitInterval = 1.2, fireworkCooldown = 5.0, cbInterval = 4.0;
            if (botDifficulty === 'easy') {
                speedMult = 0.6; hitInterval = 2.0; fireworkCooldown = 8.0; cbInterval = 6.0;
            } else if (botDifficulty === 'hard') {
                speedMult = 1.5; hitInterval = 0.7; fireworkCooldown = 3.0; cbInterval = 2.0;
            }

            aiSteveCrossbowTimer += delta;
            if (aiSteveCrossbowTimer > cbInterval && dist > 4.0) {
                aiSteveCrossbowTimer = 0;
                shootAICrossbow();
            }

            aiSteveFireworkTimer += delta;
            if (aiSteveFireworkTimer > fireworkCooldown && aiSteveMesh.position.y <= 0.5) {
                aiSteveFireworkTimer = 0;
                aiSteveVerticalVel = botDifficulty === 'hard' ? 22.0 : 18.0; 
                aiSteveIsSmashing = true;
                playSound('firework');
                spawnParticleExplosion(aiSteveMesh.position);
                showActionText("AI STEVE USED FIREWORK BOOST!");
            }

            if (aiSteveMesh.position.y > 0.5 || aiSteveVerticalVel > 0) {
                aiSteveVerticalVel -= 25.0 * delta;
                aiSteveMesh.position.y += aiSteveVerticalVel * delta;

                if (aiSteveMesh.position.y <= 0.5) {
                    const isOverVoid = Math.abs(aiSteveMesh.position.x) > 15 || Math.abs(aiSteveMesh.position.z) > 15;
                    if (!isOverVoid) {
                        aiSteveMesh.position.y = 0.5;
                        aiSteveVerticalVel = 0;

                        if (aiSteveIsSmashing) {
                            aiSteveIsSmashing = false;
                            playSound('mace');
                            spawnParticleExplosion(aiSteveMesh.position);

                            if (dist < 4.0) {
                                const smashDmg = botDifficulty === 'hard' ? 7 : botDifficulty === 'medium' ? 5 : 3;
                                takeDamage(smashDmg, "AI Steve");
                                showActionText("AI STEVE LANDED A MACE SMASH ATTACK!");
                            }
                        }
                    }
                }
            }

            const parts = aiSteveMesh.userData;
            if (dist > 2.5) {
                const dir = playerPos.clone().sub(aiSteveMesh.position);
                dir.y = 0;
                dir.normalize();

                aiSteveMesh.position.x += dir.x * 5.0 * speedMult * delta;
                aiSteveMesh.position.z += dir.z * 5.0 * speedMult * delta;

                aiSteveMesh.lookAt(playerPos.x, aiSteveMesh.position.y, playerPos.z);

                aiSteveWalkAnimTimer += delta * 10 * speedMult;
                const swing = Math.sin(aiSteveWalkAnimTimer) * 0.6;
                if (parts.leftLegPivot) parts.leftLegPivot.rotation.x = swing;
                if (parts.rightLegPivot) parts.rightLegPivot.rotation.x = -swing;
                if (parts.leftArmPivot) parts.leftArmPivot.rotation.x = -swing;
                if (parts.rightArmPivot) parts.rightArmPivot.rotation.x = swing;
            } else {
                if (parts.leftLegPivot) parts.leftLegPivot.rotation.x = 0;
                if (parts.rightLegPivot) parts.rightLegPivot.rotation.x = 0;
                if (parts.leftArmPivot) parts.leftArmPivot.rotation.x = 0;
                if (parts.rightArmPivot) parts.rightArmPivot.rotation.x = 0;

                if (dist <= 2.5 && aiSteveMesh.position.y <= 0.5) {
                    aiSteveTimer += delta;
                    if (aiSteveTimer > hitInterval) {
                        aiSteveTimer = 0;
                        playSound('mace');
                        const maceDmg = botDifficulty === 'hard' ? 4 : botDifficulty === 'medium' ? 3 : 2;
                        takeDamage(maceDmg, "AI Steve");
                        showActionText("AI Steve Hit You with Mace!");
                    }
                }
            }
        }

        function initMultiplayer(roomCode) {
            const hostID = "donut-smp-room-" + roomCode;

            if (!remotePlayerMesh) {
                remotePlayerMesh = createStevePlayerMesh(0xff0055, false);
                remotePlayerMesh.position.set(-6, 0.5, -6);
                
                remotePlayerHealthBarMesh = createOverheadHealthBar();
                remotePlayerHealthBarMesh.position.set(0, 2.2, 0);
                remotePlayerMesh.add(remotePlayerHealthBarMesh);
                scene.add(remotePlayerMesh);
            }

            showActionText("Connecting to PeerJS Room: " + roomCode + "...");

            peer = new Peer();

            peer.on('open', () => {
                const conn = peer.connect(hostID);
                
                conn.on('open', () => {
                    peerConn = conn;
                    setupPeerEvents(peerConn);
                    showActionText("Joined Room " + roomCode + " as Client!");
                });

                conn.on('error', () => {
                    startHostingRoom(hostID, roomCode);
                });

                setTimeout(() => {
                    if (!peerConn || !peerConn.open) {
                        peer.destroy();
                        startHostingRoom(hostID, roomCode);
                    }
                }, 2500);
            });

            peer.on('error', () => {
                startHostingRoom(hostID, roomCode);
            });
        }

        function startHostingRoom(hostID, roomCode) {
            peer = new Peer(hostID);

            peer.on('open', () => {
                showActionText("Hosting Room Code: " + roomCode + " (Waiting for Player...)");

                peer.on('connection', (conn) => {
                    peerConn = conn;
                    setupPeerEvents(peerConn);
                    showActionText("Player Joined! Fight Start!");
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    showActionText("Connecting to Host Room " + roomCode + "...");
                    peer = new Peer();
                    peer.on('open', () => {
                        peerConn = peer.connect(hostID);
                        setupPeerEvents(peerConn);
                    });
                }
            });
        }

        function setupPeerEvents(conn) {
            conn.on('open', () => {
                showActionText("Connected! Match Started!");
            });

            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    if (remotePlayerMesh) remotePlayerMesh.position.set(data.x, data.y - PLAYER_EYE_HEIGHT, data.z);
                } else if (data.type === 'obsidian') {
                    placeObsidianBlock(data.x, data.y, data.z, true);
                } else if (data.type === 'crystal') {
                    placeEndCrystal(data.x, data.y, data.z, true);
                } else if (data.type === 'damage') {
                    damageRemotePlayer(data.amount);
                    if (remotePlayerMesh) spawnParticleExplosion(remotePlayerMesh.position);
                } else if (data.type === 'hit_me') {
                    takeDamage(data.damage || 3, "Enemy Player");
                } else if (data.type === 'died') {
                    showActionText("ENEMY DIED! YOU WIN!");
                }
            });
        }

        /* Build Sky/Void Floating Island Arena */
        function buildVoidIslandArena() {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const radius = 15;

            const obsMat = new THREE.MeshStandardMaterial({ color: 0x110a1f, roughness: 0.4 });
            const endStoneMat = new THREE.MeshStandardMaterial({ color: 0xdddd99, roughness: 0.8 });
            const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x332244, roughness: 0.8 });

            const islandPositions = [];

            // Floating Central Platform (Endstone Top)
            for (let x = -radius; x <= radius; x++) {
                for (let z = -radius; z <= radius; z++) {
                    const dist = Math.hypot(x, z);
                    if (dist <= radius) {
                        islandPositions.push({ pos: new THREE.Vector3(x, 0, z), mat: endStoneMat, placeable: true });
                        
                        // Tapered Island underside into the void
                        const depth = Math.floor((radius - dist) * 0.8) + 1;
                        for (let y = 1; y <= depth; y++) {
                            islandPositions.push({ pos: new THREE.Vector3(x, -y, z), mat: y > 2 ? obsMat : darkStoneMat, placeable: false });
                        }
                    }
                }
            }

            islandPositions.forEach((item) => {
                const mesh = new THREE.Mesh(boxGeo, item.mat);
                mesh.position.copy(item.pos);
                scene.add(mesh);

                if (item.placeable) {
                    placeableObjects.push(mesh);
                    solidColliders.push(mesh);
                }
            });

            // Outer Obsidian Pillars floating around the void island
            const pillarAngles = [0, Math.PI/2, Math.PI, Math.PI * 1.5];
            pillarAngles.forEach(angle => {
                const px = Math.round(Math.cos(angle) * 12);
                const pz = Math.round(Math.sin(angle) * 12);
                for (let py = 1; py <= 5; py++) {
                    const pMesh = new THREE.Mesh(boxGeo, obsMat);
                    pMesh.position.set(px, py, pz);
                    scene.add(pMesh);
                    placeableObjects.push(pMesh);
                    solidColliders.push(pMesh);
                }
            });
        }

        function setupMobileTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const joystickKnob = document.getElementById('joystick-knob');
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

            window.addEventListener('touchstart', (e) => {
                if (isDead) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.clientX < window.innerWidth / 2 && touchMoveID === null) {
                        touchMoveID = touch.identifier;
                        updateJoystick(touch);
                    } else if (touch.clientX >= window.innerWidth / 2 && touchLookID === null) {
                        touchLookID = touch.identifier;
                        touchLookLastX = touch.clientX;
                        touchLookLastY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchMoveID) {
                        updateJoystick(touch);
                    } else if (touch.identifier === touchLookID && !isInventoryOpen) {
                        const deltaX = touch.clientX - touchLookLastX;
                        const deltaY = touch.clientY - touchLookLastY;

                        cameraEuler.setFromQuaternion(camera.quaternion);
                        cameraEuler.y -= deltaX * 0.005;
                        cameraEuler.x -= deltaY * 0.005;
                        cameraEuler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraEuler.x));
                        camera.quaternion.setFromEuler(cameraEuler);

                        touchLookLastX = touch.clientX;
                        touchLookLastY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', resetTouches);
            window.addEventListener('touchcancel', resetTouches);

            function resetTouches(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchMoveID) {
                        touchMoveID = null;
                        moveForward = moveBackward = moveLeft = moveRight = false;
                        joystickKnob.style.transform = `translate(0px, 0px)`;
                    } else if (touch.identifier === touchLookID) {
                        touchLookID = null;
                    }
                }
            }

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const dist = Math.min(Math.hypot(dx, dy), 40);
                const angle = Math.atan2(dy, dx);

                const kx = Math.cos(angle) * dist;
                const ky = Math.sin(angle) * dist;
                joystickKnob.style.transform = `translate(${kx}px, ${ky}px)`;

                moveForward = dy < -10;
                moveBackward = dy > 10;
                moveLeft = dx > 10;
                moveRight = dx < -10;
            }

            document.getElementById('btn-inv').addEventListener('touchstart', (e) => {
                e.preventDefault();
                toggleInventory();
            });

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isDead) return;
                const activeItem = inventorySlots[currentSlot - 1];
                if (canJump) { 
                    velocity.y += 11.0; 
                    canJump = false; 
                } else if (activeItem && activeItem.type === 'firework' && !isGliding) {
                    isGliding = true;
                    showActionText("Elytra Gliding!");
                }
            });

            document.getElementById('btn-hit').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isDead) handleLeftClick();
            });

            document.getElementById('btn-place').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isDead) handleRightClick();
            });
        }

        function handleLeftClick() {
            if (isDead) return;
            const activeItem = inventorySlots[currentSlot - 1];
            const activeType = activeItem ? activeItem.type : null;

            if (activeType === 'sword') swingSwordAnimation();
            else if (activeType === 'arrow') { shootCrossbow(); return; }
            else if (activeType === 'mace') swingMaceAnimation();
            else if (activeType === 'enderpearl') { throwEnderPearl(); return; }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const crystalHits = raycaster.intersectObjects(endCrystals, true);
            if (crystalHits.length > 0) {
                let hitObj = crystalHits[0].object;
                while (hitObj.parent && hitObj.parent !== scene) hitObj = hitObj.parent;
                detonateCrystal(hitObj);
                return;
            }

            const fallDamageBonus = activeType === 'mace' ? Math.max(1, Math.abs(velocity.y) * 0.4) : 1;
            const baseDmg = activeType === 'mace' ? Math.round(5 * fallDamageBonus) : 3;

            if (broPlayerMesh || remotePlayerMesh) {
                const targetBro = broPlayerMesh || remotePlayerMesh;
                const broHits = raycaster.intersectObjects(targetBro.children, true);
                if (broHits.length > 0) {
                    if (gameMode === 'bro') {
                        showActionText(`Hit Brother! (-${baseDmg} HP)`);
                        spawnParticleExplosion(targetBro.position);
                    } else if (gameMode === 'mp') {
                        damageRemotePlayer(baseDmg);
                        if (peerConn && peerConn.open) {
                            peerConn.send({ type: 'hit_me', damage: baseDmg });
                            peerConn.send({ type: 'damage', amount: baseDmg });
                        }
                        showActionText(`Hit Enemy Player! (-${baseDmg} HP)`);
                        spawnParticleExplosion(targetBro.position);
                    }
                    return;
                }
            }

            if (aiSteveMesh) {
                const steveHits = raycaster.intersectObjects(aiSteveMesh.children, true);
                if (steveHits.length > 0) {
                    damageAISteve(baseDmg);
                    return;
                }
            }
        }

        function handleRightClick() {
            if (isDead) return;
            const activeItem = inventorySlots[currentSlot - 1];
            const activeType = activeItem ? activeItem.type : null;

            if (activeType === 'gapple') { eatGoldenApple(); return; }
            if (activeType === 'firework') { useFireworkBoost(); return; }
            if (activeType === 'enderpearl') { throwEnderPearl(); return; }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(placeableObjects, false);

            if (intersects.length > 0 && intersects[0].distance <= 6.5) {
                const hit = intersects[0];
                const point = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(0.5));
                const gridX = Math.round(point.x);
                const gridY = Math.round(point.y);
                const gridZ = Math.round(point.z);

                if (activeType === 'obsidian' && activeItem.count > 0) {
                    placeObsidianBlock(gridX, gridY, gridZ);
                    if (peerConn && peerConn.open) peerConn.send({ type: 'obsidian', x: gridX, y: gridY, z: gridZ });
                } else if (activeType === 'crystal' && activeItem.count > 0) {
                    placeEndCrystal(gridX, gridY, gridZ);
                    if (peerConn && peerConn.open) peerConn.send({ type: 'crystal', x: gridX, y: gridY, z: gridZ });
                }
            }
        }

                const activeItem = inventorySlots[currentSlot - 1];

                activeItem.count--;

            playSound('place');

            const obsGeo = new THREE.BoxGeometry(1, 1, 1);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x1a0d2b, roughness: 0.4 });
            const mesh = new THREE.Mesh(obsGeo, obsMat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            placeableObjects.push(mesh);
            solidColliders.push(mesh);
        }

            if (!isRemote) {
                const activeItem = inventorySlots[currentSlot - 1];
                if (!activeItem || activeItem.type !== 'crystal' || activeItem.count <= 0) return;
                activeItem.count--;
                if (activeItem.count <= 0) inventorySlots[currentSlot - 1] = { type: null, count: 0 };

            const crystal = createEndCrystalMesh();
            crystal.position.set(x, y, z);
            scene.add(crystal);
            endCrystals.push(crystal);

        function detonateCrystal(crystalObj) {
            playSound('explode');
            spawnParticleExplosion(crystalObj.position);

            const index = endCrystals.indexOf(crystalObj);
            if (index > -1) endCrystals.splice(index, 1);
            scene.remove(crystalObj);

            const dist = camera.position.distanceTo(crystalObj.position);
            if (dist < 6.0) {
                const dmg = Math.round((6.0 - dist) * 1.5) + 3;
                takeDamage(dmg, "End Crystal Explosion");
                showActionText(`BOOM! End Crystal Damage (-${dmg} HP)`);
            }
        }

        function spawnParticleExplosion(pos) {
            const particleCount = 20;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y + 0.5;
                positions[i * 3 + 2] = pos.z;

                velocities.push(new THREE.Vector3(
                    (Math.random() - 0.5) * 8.0,
                    Math.random() * 6.0 + 2.0,
                    (Math.random() - 0.5) * 8.0
                ));
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.25 });
            const pSystem = new THREE.Points(geo, mat);

            scene.add(pSystem);
            particleSystems.push({ system: pSystem, vels: velocities, age: 0 });
        }

        function showActionText(msg) {
            const el = document.getElementById('action-text');
            el.innerText = msg;
            el.style.opacity = '1';
            if (textTimeout) clearTimeout(textTimeout);
            textTimeout = setTimeout(() => { el.style.opacity = '0'; }, 2200);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!isDead) {
                // Crystal Float Rotation Animation
                endCrystals.forEach(c => {
                    const outer = c.userData.outerCrystal;
                    if (outer) {
                        outer.rotation.y += 0.03;
                        outer.position.y = 0.85 + Math.sin(time * 0.003 + c.userData.floatOffset) * 0.1;
                    }
                });

                // Ender Pearls Projectiles Update
                for (let i = activeEnderPearls.length - 1; i >= 0; i--) {
                    const pearlData = activeEnderPearls[i];
                    pearlData.age += delta;

                    pearlData.velocity.y -= 18.0 * delta; // Gravity
                    pearlData.mesh.position.addScaledVector(pearlData.velocity, delta);

                    if (pearlData.mesh.position.y <= 0.5 || pearlData.age > 4.0) {
                        // Teleport player to pearl landing position!
                        controls.getObject().position.set(
                            pearlData.mesh.position.x,
                            Math.max(0.5, pearlData.mesh.position.y) + PLAYER_EYE_HEIGHT,
                            pearlData.mesh.position.z
                        );

                        takeDamage(1, "Ender Pearl Fall"); // Pearl teleport self damage
                        playSound('pearl');
                        spawnParticleExplosion(pearlData.mesh.position);

                        scene.remove(pearlData.mesh);
                        activeEnderPearls.splice(i, 1);
                        showActionText("Ender Pearl Teleported You!");
                    }
                }

                // Crossbow Rocket Arrows Update
                for (let i = activeArrows.length - 1; i >= 0; i--) {
                    const arrow = activeArrows[i];
                    arrow.age += delta;
                    arrow.mesh.position.addScaledVector(arrow.dir, delta);

                    let hitDetected = false;
                    if (arrow.isFromBot) {
                        const distToPlayer = arrow.mesh.position.distanceTo(camera.position);
                        if (distToPlayer < 1.2) {
                            hitDetected = true;
                            takeDamage(3, "AI Steve");
                            showActionText("Hit by AI Steve's Crossbow!");
                        }
                    } else {
                        if (aiSteveMesh) {
                            const distToSteve = arrow.mesh.position.distanceTo(aiSteveMesh.position);
                            if (distToSteve < 1.4) {
                                hitDetected = true;
                                damageAISteve(4);
                                showActionText("Rocket Arrow Hit AI Steve!");
                            }
                        }
                    }

                    if (hitDetected || arrow.mesh.position.y <= -20 || arrow.age > 3.0) {
                        spawnParticleExplosion(arrow.mesh.position);
                        scene.remove(arrow.mesh);
                        activeArrows.splice(i, 1);
                    }
                }

                // Particle System Physics Update
                for (let i = particleSystems.length - 1; i >= 0; i--) {
                    const ps = particleSystems[i];
                    ps.age += delta;
                    const posAttr = ps.system.geometry.attributes.position;

                    for (let j = 0; j < ps.vels.length; j++) {
                        ps.vels[j].y -= 9.8 * delta;
                        posAttr.setXYZ(
                            j,
                            posAttr.getX(j) + ps.vels[j].x * delta,
                            posAttr.getY(j) + ps.vels[j].y * delta,
                            posAttr.getZ(j) + ps.vels[j].z * delta
                        );
                    }
                    posAttr.needsUpdate = true;

                    if (ps.age > 0.8) {
                        scene.remove(ps.system);
                        particleSystems.splice(i, 1);
                    }
                }

                // Player Movement Physics
                if (controls.isLocked || isMobile) {
                    velocity.x -= velocity.x * 10.0 * delta;
                    velocity.z -= velocity.z * 10.0 * delta;

                    if (isGliding) {
                        velocity.y -= 3.0 * delta;
                    } else {
                        velocity.y -= 25.0 * delta;
                    }

                    const moveDir = new THREE.Vector3();
                    if (moveForward) moveDir.z -= 1;
                    if (moveBackward) moveDir.z += 1;
                    if (moveLeft) moveDir.x -= 1;
                    if (moveRight) moveDir.x += 1;
                    moveDir.normalize();

                    if (moveForward || moveBackward) velocity.z += moveDir.z * 50.0 * delta;
                    if (moveLeft || moveRight) velocity.x += moveDir.x * 50.0 * delta;

                    controls.moveRight(-velocity.x * delta);
                    controls.moveForward(-velocity.z * delta);

                    const playerObj = controls.getObject();
                    playerObj.position.y += velocity.y * delta;

                    // Island Surface Ground Collision Check (Inside 15-block radius)
                    const distFromCenter = Math.hypot(playerObj.position.x, playerObj.position.z);
                    if (distFromCenter <= 15.5 && playerObj.position.y <= 0.5 + PLAYER_EYE_HEIGHT) {
                        velocity.y = 0;
                        playerObj.position.y = 0.5 + PLAYER_EYE_HEIGHT;
                        canJump = true;
                        isGliding = false;
                    }

                    // Void Fall Detection Trigger
                    if (playerObj.position.y < -15.0) {
                        triggerDeath("The Void");
                    }

                    broadcastPlayerPos();
                }

                // AI Steve Bot Behavior Updates
                if (gameMode === 'ai') updateAISteveLogic(delta);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
