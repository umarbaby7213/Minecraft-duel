<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donut SMP Crystal PvP Arena</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #game-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    /* UI Overlay */
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
      font-weight: bold;
    }
    .stat-bar {
      margin: 5px 0;
      font-size: 18px;
    }
    
    /* Settings Panel */
    #settings-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 20, 0.95);
      border: 3px solid #ffaa00;
      border-radius: 12px;
      padding: 25px;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 320px;
      z-index: 100;
    }
    #settings-panel h2 {
      margin: 0 0 10px 0;
      text-align: center;
      color: #ffaa00;
    }
    .setting-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      font-size: 16px;
    }
    select, input[type="range"], button {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button.btn-primary {
      background: #ffaa00;
      color: #111;
      border: none;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
    
    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <div class="stat-bar" id="p1-hp">Player 1 HP: 100</div>
    <div class="stat-bar" id="p2-hp">Bro / Bot HP: 100</div>
    <div class="stat-bar" id="game-status">Mode: Vs AI Bot</div>
  </div>

  <div id="crosshair"></div>

  <!-- Settings Panel -->
  <div id="settings-panel">
    <h2>PvP Match Settings</h2>

    <div class="setting-group">
      <label for="mode-select">Game Mode:</label>
      <select id="mode-select">
        <option value="bot">You vs AI Bot</option>
        <option value="bro">Bro vs Bro (2 Players)</option>
      </select>
    </div>

    <div class="setting-group" id="bot-diff-group">
      <label for="bot-diff">Bot Difficulty:</label>
      <select id="bot-diff">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="p1-ff">Player 1 Friendly Fire:</label>
      <select id="p1-ff">
        <option value="off">OFF</option>
        <option value="on">ON (Duel Ready)</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="p2-ff">Bro Friendly Fire:</label>
      <select id="p2-ff">
        <option value="off">OFF</option>
        <option value="on">ON (Duel Ready)</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="fov-slider">Field of View (FOV): <span id="fov-val">75</span></label>
      <input type="range" id="fov-slider" min="60" max="110" value="75">
    </div>

    <button class="btn-primary" id="start-btn">Apply & Resume Game</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <script>
    // --- Game Configuration & State ---
    const config = {
      mode: 'bot', // 'bot' or 'bro'
      botDifficulty: 'medium', // 'easy', 'medium', 'hard'
      p1FF: false,
      p2FF: false,
      fov: 75
    };

    const players = {
      p1: { hp: 100, pos: new THREE.Vector3(-10, 2, 0), speed: 0.15 },
      p2: { hp: 100, pos: new THREE.Vector3(10, 2, 0), speed: 0.15, isGliding: false, elytra: true, crossbowCooldown: 0 }
    };

    // Bot Configuration (Difficulty levels)
    const botStats = {
      easy: { speed: 0.08, attackRate: 180, accuracy: 0.6, fireworkBoost: 0.2 },
      medium: { speed: 0.14, attackRate: 100, accuracy: 0.8, fireworkBoost: 0.35 },
      hard: { speed: 0.22, attackRate: 50, accuracy: 0.95, fireworkBoost: 0.5 }
    };

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(config.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(20, 40, 20);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Arena Floor
    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Player 1 Mesh
    const p1Geo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
    const p1Mat = new THREE.MeshStandardMaterial({ color: 0x0088ff });
    const p1Mesh = new THREE.Mesh(p1Geo, p1Mat);
    scene.add(p1Mesh);

    // Player 2 / Bot Mesh (with Elytra Wings)
    const p2Geo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
    const p2Mat = new THREE.MeshStandardMaterial({ color: 0xff3300 });
    const p2Mesh = new THREE.Mesh(p2Geo, p2Mat);
    
    // Add Elytra Wings Visual to P2 / AI Bot
    const wingGeo = new THREE.PlaneGeometry(1, 2);
    const wingMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide });
    const leftWing = new THREE.Mesh(wingGeo, wingMat);
    leftWing.position.set(-0.8, 0, -0.6);
    leftWing.rotation.y = Math.PI / 4;
    p2Mesh.add(leftWing);

    const rightWing = leftWing.clone();
    rightWing.position.set(0.8, 0, -0.6);
    rightWing.rotation.y = -Math.PI / 4;
    p2Mesh.add(rightWing);

    scene.add(p2Mesh);

    // Projectiles System (Crossbow Fireworks)
    const fireworks = [];

    function spawnCrossbowFirework(fromPos, targetPos, speed) {
      const geo = new THREE.SphereGeometry(0.3, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(fromPos);
      
      const dir = new THREE.Vector3().subVectors(targetPos, fromPos).normalize();
      scene.add(mesh);

      fireworks.push({ mesh, dir, speed, life: 100 });
    }

    // --- UI Controls ---
    const panel = document.getElementById('settings-panel');
    const modeSelect = document.getElementById('mode-select');
    const botDiffSelect = document.getElementById('bot-diff');
    const botDiffGroup = document.getElementById('bot-diff-group');
    const p1FFSelect = document.getElementById('p1-ff');
    const p2FFSelect = document.getElementById('p2-ff');
    const fovSlider = document.getElementById('fov-slider');
    const fovVal = document.getElementById('fov-val');
    const startBtn = document.getElementById('start-btn');

    modeSelect.addEventListener('change', (e) => {
      config.mode = e.target.value;
      botDiffGroup.style.display = config.mode === 'bot' ? 'flex' : 'none';
      document.getElementById('game-status').innerText = `Mode: ${config.mode === 'bot' ? 'Vs AI Bot' : 'Bro vs Bro'}`;
    });

    botDiffSelect.addEventListener('change', (e) => {
      config.botDifficulty = e.target.value;
    });

    p1FFSelect.addEventListener('change', (e) => {
      config.p1FF = e.target.value === 'on';
    });

    p2FFSelect.addEventListener('change', (e) => {
      config.p2FF = e.target.value === 'on';
    });

    fovSlider.addEventListener('input', (e) => {
      config.fov = parseInt(e.target.value);
      fovVal.innerText = config.fov;
      camera.fov = config.fov;
      camera.updateProjectionMatrix();
    });

    startBtn.addEventListener('click', () => {
      panel.style.display = 'none';
    });

    // Toggle menu with 'Escape'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
      }
    });

    // --- Damage Rules ---
    function attemptDamage(attacker, victim, amount) {
      // AI Bot Mode: Hits against/from Bot always deal damage
      if (config.mode === 'bot') {
        players[victim].hp = Math.max(0, players[victim].hp - amount);
        return true;
      }

      // Bro vs Bro Mode: Damage ONLY happens if BOTH players turn Friendly Fire ON
      if (config.mode === 'bro') {
        if (config.p1FF && config.p2FF) {
          players[victim].hp = Math.max(0, players[victim].hp - amount);
          return true;
        } else {
          console.log("No damage dealt! Both players must turn Friendly Fire ON to duel.");
          return false;
        }
      }
    }

    // Left Click Attack Trigger (Player 1 Attack)
    window.addEventListener('click', () => {
      const dist = players.p1.pos.distanceTo(players.p2.pos);
      if (dist < 4) {
        attemptDamage('p1', 'p2', 15);
      }
    });

    // --- AI Bot Movement & Combat (Crossbow + Elytra + Fireworks) ---
    let botTimer = 0;
    function updateAIBot() {
      if (config.mode !== 'bot') return;

      const bot = players.p2;
      const target = players.p1.pos;
      const stats = botStats[config.botDifficulty];

      // 1. Follow Player
      const dir = new THREE.Vector3().subVectors(target, bot.pos).normalize();
      bot.pos.add(dir.multiplyScalar(stats.speed));

      // 2. Elytra Glide + Firework Boosts
      if (Math.random() < 0.01) {
        bot.isGliding = true;
        bot.pos.y += stats.fireworkBoost * 10;
      }
      if (bot.pos.y > 2) {
        bot.pos.y -= 0.1; // Elytra slow descent
      } else {
        bot.pos.y = 2;
        bot.isGliding = false;
      }

      // 3. Fire Crossbow Fireworks
      botTimer++;
      if (botTimer >= stats.attackRate) {
        botTimer = 0;
        spawnCrossbowFirework(bot.pos, target, 0.4);
      }
    }

    // --- Main Loop ---
    function animate() {
      requestAnimationFrame(animate);

      updateAIBot();

      p1Mesh.position.copy(players.p1.pos);
      p2Mesh.position.copy(players.p2.pos);

      camera.position.set(players.p1.pos.x, players.p1.pos.y + 4, players.p1.pos.z + 12);
      camera.lookAt(players.p1.pos);

      // Process Fireworks
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.mesh.position.addScaledVector(fw.dir, fw.speed);
        fw.life--;

        if (fw.mesh.position.distanceTo(players.p1.pos) < 1.5) {
          attemptDamage('p2', 'p1', 20);
          scene.remove(fw.mesh);
          fireworks.splice(i, 1);
          continue;
        }

        if (fw.life <= 0) {
          scene.remove(fw.mesh);
          fireworks.splice(i, 1);
        }
      }

      document.getElementById('p1-hp').innerText = `Player 1 HP: ${players.p1.hp}`;
      document.getElementById('p2-hp').innerText = `${config.mode === 'bot' ? 'AI Bot' : 'Bro'} HP: ${players.p2.hp}`;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
