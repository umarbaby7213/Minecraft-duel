<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Donut SMP - End Crystal PvP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 2px #000; }
        #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
        #crosshair::after { left: 0; top: 7px; width: 16px; height: 2px; }
        
        /* Flash Overlays */
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0); pointer-events: none; z-index: 4; transition: background 0.05s ease-out; }
        
        /* Totem Pop Overlay */
        #totem-pop-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            pointer-events: none; z-index: 8; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            font-size: 130px; text-shadow: 0 0 20px #ffaa00;
        }
        #totem-pop-overlay.active { transform: translate(-50%, -50%) scale(1.4); }

        /* HUD Container - Shifted slightly higher up for mobile visibility */
        #hud { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 7; }
        
        /* Hearts & Food Row */
        .status-wrapper { display: flex; justify-content: space-between; width: 100%; margin-bottom: 6px; gap: 10px; }
        .hearts-bar, .food-bar { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 4px; border: 2px solid #3c3c3c; }
        .heart-wrapper, .shank-wrapper { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        
        /* Pixel Art Icons */
        .pixel-heart {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                2px 0px 0 #000, 3px 0px 0 #000, 6px 0px 0 #000, 7px 0px 0 #000,
                1px 1px 0 #000, 2px 1px 0 #e02424, 3px 1px 0 #ff6b6b, 4px 1px 0 #000, 5px 1px 0 #000, 6px 1px 0 #e02424, 7px 1px 0 #e02424, 8px 1px 0 #000,
                0px 2px 0 #000, 1px 2px 0 #ffffff, 2px 2px 0 #ff6b6b, 3px 2px 0 #e02424, 4px 2px 0 #e02424, 5px 2px 0 #e02424, 6px 2px 0 #e02424, 7px 2px 0 #9c0000, 8px 2px 0 #000,
                0px 3px 0 #000, 1px 3px 0 #ff6b6b, 2px 3px 0 #e02424, 3px 3px 0 #e02424, 4px 3px 0 #e02424, 5px 3px 0 #e02424, 6px 3px 0 #e02424, 7px 3px 0 #9c0000, 8px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #e02424, 2px 4px 0 #e02424, 3px 4px 0 #e02424, 4px 4px 0 #e02424, 5px 4px 0 #e02424, 6px 4px 0 #e02424, 7px 4px 0 #9c0000, 8px 4px 0 #000,
                1px 5px 0 #000, 2px 5px 0 #e02424, 3px 5px 0 #e02424, 4px 5px 0 #e02424, 5px 5px 0 #e02424, 6px 5px 0 #9c0000, 7px 5px 0 #000,
                2px 6px 0 #000, 3px 6px 0 #e02424, 4px 6px 0 #e02424, 5px 6px 0 #9c0000, 6px 6px 0 #000,
                3px 7px 0 #000, 4px 7px 0 #e02424, 5px 7px 0 #000, 4px 8px 0 #000;
            transform: scale(1.6); transition: opacity 0.2s;
        }
        .pixel-heart.empty { opacity: 0.2; }

        .pixel-shank {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                4px 0px 0 #000, 5px 0px 0 #000,
                3px 1px 0 #000, 4px 1px 0 #d1a880, 5px 1px 0 #bd6328, 6px 1px 0 #000,
                2px 2px 0 #000, 3px 2px 0 #d1a880, 4px 2px 0 #bd6328, 5px 2px 0 #8b3a0f, 6px 2px 0 #000,
                1px 3px 0 #000, 2px 3px 0 #bd6328, 3px 3px 0 #bd6328, 4px 3px 0 #8b3a0f, 5px 3px 0 #5c2204, 6px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #bd6328, 2px 4px 0 #8b3a0f, 3px 4px 0 #8b3a0f, 4px 4px 0 #5c2204, 5px 4px 0 #000,
                0px 5px 0 #000, 1px 5px 0 #8b3a0f, 2px 5px 0 #8b3a0f, 3px 5px 0 #000,
                0px 6px 0 #000, 1px 6px 0 #d1a880, 2px 6px 0 #000,
                1px 7px 0 #000, 2px 7px 0 #ffffff, 3px 7px 0 #000, 2px 8px 0 #000;
            transform: scale(1.6);
        }

        .pixel-gapple {
            width: 9px; height: 9px; image-rendering: pixelated;
            box-shadow: 
                4px 0px 0 #5c2204, 5px 0px 0 #5c2204, 4px 1px 0 #5c2204,
                2px 2px 0 #000, 3px 2px 0 #000, 6px 2px 0 #000, 7px 2px 0 #000,
                1px 3px 0 #000, 2px 3px 0 #fff3a1, 3px 3px 0 #ffd700, 4px 3px 0 #000, 5px 3px 0 #000, 6px 3px 0 #ffd700, 7px 3px 0 #ffd700, 8px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #ffffff, 2px 4px 0 #ffd700, 3px 4px 0 #ffaa00, 4px 4px 0 #ffaa00, 5px 4px 0 #ffaa00, 6px 4px 0 #ffaa00, 7px 4px 0 #c77b00, 8px 4px 0 #000,
                0px 5px 0 #000, 1px 5px 0 #ffd700, 2px 5px 0 #ffaa00, 3px 5px 0 #ffaa00, 4px 5px 0 #ffaa00, 5px 5px 0 #ffaa00, 6px 5px 0 #ffaa00, 7px 5px 0 #c77b00, 8px 5px 0 #000,
                0px 6px 0 #000, 1px 6px 0 #ffaa00, 2px 6px 0 #ffaa00, 3px 6px 0 #ffaa00, 4px 6px 0 #ffaa00, 5px 6px 0 #ffaa00, 6px 6px 0 #ffaa00, 7px 6px 0 #c77b00, 8px 6px 0 #000,
                1px 7px 0 #000, 2px 7px 0 #ffaa00, 3px 7px 0 #ffaa00, 4px 7px 0 #ffaa00, 5px 7px 0 #ffaa00, 6px 7px 0 #c77b00, 7px 7px 0 #000,
                2px 8px 0 #000, 3px 8px 0 #ffaa00, 4px 8px 0 #ffaa00, 5px 8px 0 #c77b00, 6px 8px 0 #000,
                3px 9px 0 #000, 4px 9px 0 #ffaa00, 5px 9px 0 #000, 4px 10px 0 #000;
            transform: scale(1.5);
        }

        /* Hotbar (8 Slots matching user image preference) */
        #hotbar-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: auto; }
        #hotbar { display: flex; background: rgba(0, 0, 0, 0.7); border: 3px solid #3c3c3c; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .slot { width: 40px; height: 40px; border: 2px solid #8b8b8b; background: rgba(139, 139, 139, 0.3); margin: 2px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 16px; position: relative; cursor: pointer; }
        .slot.active { border-color: #ffffff; background: rgba(255, 255, 255, 0.4); box-shadow: inset 0 0 8px #fff; }
        .slot-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: #aaa; font-weight: bold; }
        .count-badge { position: absolute; bottom: 1px; right: 2px; font-size: 9px; color: #fff; font-weight: bold; text-shadow: 1px 1px #000; }

        /* Full Inventory GUI Screen (Opened with 'E') */
        #inventory-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 420px; background: #c6c6c6; border: 4px solid #373737; border-radius: 6px;
            padding: 15px; display: none; flex-direction: column; gap: 10px; z-index: 20;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8); pointer-events: auto;
        }
        #inventory-screen h3 { color: #373737; font-size: 15px; margin-bottom: 5px; text-align: center; font-weight: bold; }
        .inv-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background: #8b8b8b; padding: 6px; border: 3px solid #373737; }
        .inv-slot { width: 34px; height: 34px; background: #8b8b8b; border: 2px solid #373737; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; position: relative; }
        .inv-slot:hover { background: #aaaaaa; }

        /* Custom ESC Settings Menu Modal */
        #esc-settings-menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 320px; background: rgba(30, 30, 30, 0.95); border: 3px solid #ffaa00; border-radius: 8px;
            padding: 20px; display: none; flex-direction: column; gap: 12px; z-index: 50;
            box-shadow: 0 0 30px rgba(0,0,0,0.9); color: #fff; text-align: center; pointer-events: auto;
        }
        #esc-settings-menu h2 { font-size: 18px; color: #ffaa00; margin-bottom: 5px; }
        .settings-btn { padding: 10px; background: #444; color: #fff; border: 1px solid #777; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: inherit; }
        .settings-btn:hover { background: #555; }

        /* Minecraft Classic D-Pad Style Controls Overlay (Matched to User Image) */
        #dpad-container { position: absolute; bottom: 25px; left: 20px; width: 140px; height: 140px; z-index: 6; display: none; }
        .dpad-btn {
            position: absolute; width: 42px; height: 42px; background: rgba(100, 100, 100, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 4px; color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold;
        }
        .dpad-btn:active, .dpad-btn.pressed { background: rgba(255, 255, 255, 0.5); }
        #dpad-up { top: 0; left: 49px; }
        #dpad-left { top: 49px; left: 0; }
        #dpad-center { top: 49px; left: 49px; background: rgba(80, 80, 80, 0.7); }
        #dpad-right { top: 49px; right: 0; }
        #dpad-down { bottom: 0; left: 49px; }

        #mobile-buttons { position: absolute; bottom: 25px; right: 20px; display: none; flex-direction: column; gap: 8px; z-index: 6; }
        .mobile-btn { width: 54px; height: 54px; background: rgba(0, 0, 0, 0.6); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 11px; font-weight: bold; display: flex; justify-content: center; align-items: center; text-align: center; }
        .mobile-btn:active { background: rgba(255, 255, 255, 0.4); }

        /* Action Text Overlay */
        #action-text { position: absolute; top: 60%; left: 50%; transform: translateX(-50%); color: #ffeb3b; font-size: 16px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5; }

        /* Settings Options UI */
        .option-group { display: flex; flex-direction: column; gap: 4px; text-align: left; margin-bottom: 8px; }
        .option-group label { color: #aaa; font-size: 12px; font-weight: bold; }
        .option-select { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #ffaa00; border-radius: 4px; font-family: inherit; font-size: 13px; }

        /* Start Screen Blocker */
        #blocker { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 30; }
        #instructions { text-align: center; padding: 25px; background: rgba(20, 20, 20, 0.95); border: 3px solid #ff0055; box-shadow: 0 0 30px #ff0055; border-radius: 8px; max-width: 90%; width: 480px; max-height: 90vh; overflow-y: auto; }
        .mode-btn { margin: 8px 0; padding: 12px; width: 100%; background: #ff0055; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .mode-btn:hover { background: #ff3377; }
        #room-input { width: 100%; padding: 10px; margin: 8px 0; text-align: center; font-size: 18px; border-radius: 5px; border: 2px solid #ffaa00; background: #222; color: #fff; }
        .mp-btn-container { display: flex; gap: 10px; width: 100%; }
        .mp-btn { flex: 1; margin: 4px 0; padding: 10px; color: #fff; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
    <!-- Three.js, PointerLockControls & PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="crosshair"></div>
        <div id="flash-overlay"></div>
        <div id="totem-pop-overlay">🗿</div>
        <div id="action-text">Donut SMP Crystal PvP Loaded!</div>

        <!-- Minecraft Classic D-Pad Touch Controls (Left Side) -->
        <div id="dpad-container">
            <div class="dpad-btn" id="dpad-up">▲</div>
            <div class="dpad-btn" id="dpad-left">◀</div>
            <div class="dpad-btn" id="dpad-center">◆</div>
            <div class="dpad-btn" id="dpad-right">▶</div>
            <div class="dpad-btn" id="dpad-down">▼</div>
        </div>

        <!-- Mobile Action Buttons (Right Side) -->
        <div id="mobile-buttons">
            <div class="mobile-btn" id="btn-inv" style="border-color:#ffaa00;">INV</div>
            <div class="mobile-btn" id="btn-jump">JUMP</div>
            <div class="mobile-btn" id="btn-hit" style="border-color:#ff5555;">HIT</div>
            <div class="mobile-btn" id="btn-place" style="border-color:#55ff55;">PLACE</div>
        </div>

        <!-- Full Inventory GUI Screen -->
        <div id="inventory-screen">
            <h3>PLAYER INVENTORY (Press E to Close)</h3>
            <div class="inv-grid" id="inv-grid-container"></div>
            <p style="font-size: 11px; color: #333; text-align: center;">Click any item to refill hotbar slot to 64!</p>
        </div>

        <!-- ESC Settings Menu Modal -->
        <div id="esc-settings-menu">
            <h2>GAME SETTINGS</h2>
            <p style="font-size: 12px; color: #aaa;">Press ESC to resume game</p>
            <button class="settings-btn" id="btn-resume">Resume Game</button>
            <button class="settings-btn" id="btn-respawn" style="background:#8b0000;">Respawn Player</button>

        <!-- HUD -->
        <div id="hud">
            <div class="status-wrapper">
                <div class="hearts-bar" id="hearts-container">
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                    <div class="heart-wrapper"><div class="pixel-heart"></div></div>
                </div>
                <div class="food-bar">
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>
                    <div class="shank-wrapper"><div class="pixel-shank"></div></div>

            <!-- Hotbar (8 Slots matching user image preference) -->

                <div id="hotbar">
                    <div class="slot active" id="slot-1" onclick="selectSlot(1)"><span class="slot-num">1</span>🗡️</div>
                    <div class="slot" id="slot-2" onclick="selectSlot(2)"><span class="slot-num">2</span><div class="pixel-gapple"></div><span class="count-badge" id="gapple-count">64</span></div>

                    <div class="slot" id="slot-4" onclick="selectSlot(4)"><span class="slot-num">4</span>⬛<span class="count-badge" id="obsidian-count">64</span></div>
                    <div class="slot" id="slot-5" onclick="selectSlot(5)"><span class="slot-num">5</span>🗿<span class="count-badge" id="totem-count">64</span></div>
                    <div class="slot" id="slot-6" onclick="selectSlot(6)"><span class="slot-num">6</span>🏹<span class="count-badge" id="arrow-count">64</span></div>
                    <div class="slot" id="slot-7" onclick="selectSlot(7)"><span class="slot-num">7</span>🚀<span class="count-badge" id="firework-count">64</span></div>

        <!-- Start Overlay -->
        <div id="blocker">

    <script>
        let scene, camera, renderer, controls, raycaster;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        let prevTime = performance.now();

        let botDifficulty = 'medium';
        let isMobile = false;
        let touchLookID = null;
        let touchLookLastX = 0, touchLookLastY = 0;
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');

        let currentSlot = 1; 
        let playerHealth = 10;
        const maxHealth = 10;
        let textTimeout = null;
        let isInventoryOpen = false;
        let isSettingsOpen = false;

        let counts = { gapple: 64, crystal: 64, obsidian: 64, totem: 64, arrow: 64, firework: 64, mace: 64 };
        let isGliding = false;
        let gameMode = 'none';
        let peer, peerConn;
        let remotePlayerMesh = null, broPlayerMesh = null;
        let aiSteveMesh = null, aiSteveHealth = 10, aiSteveTotems = 64, aiSteveHealthBarMesh = null;

        let swordMesh, heldTotemMesh, maceMesh;
        const activeArrows = [];
        const placeableObjects = [];
        const endCrystals = [];
        const particleSystems = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'explode') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.6);
                gain.gain.setValueAtTime(1.0, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'mace') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                gain.gain.setValueAtTime(0.9, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'firework') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'place') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'sword') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'totem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        function detectMobile() { return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0); }

        function init() {
            isMobile = detectMobile();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5c88c7);
            scene.fog = new THREE.FogExp2(0x5c88c7, 0.005);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            raycaster = new THREE.Raycaster();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5ea, 0.9);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            document.getElementById('bot-difficulty-select').addEventListener('change', (e) => { botDifficulty = e.target.value; });
            document.getElementById('fov-select').addEventListener('change', (e) => {
                camera.fov = parseFloat(e.target.value);
                camera.updateProjectionMatrix();
            });

            document.getElementById('btn-mode-ai').addEventListener('click', () => { gameMode = 'ai'; startGame(); spawnAISteve(); });
            document.getElementById('btn-mode-bro').addEventListener('click', () => { gameMode = 'bro'; startGame(); spawnBrotherPlayer(); });
            document.getElementById('btn-join-mp').addEventListener('click', () => {
                const roomCode = document.getElementById('room-input').value.trim();
                if (!roomCode || roomCode.length < 2) { alert('Please enter a valid room code (e.g. 1234)!'); return; }
                gameMode = 'mp'; startGame(); initMultiplayer(roomCode);
            });

            document.getElementById('btn-resume').addEventListener('click', toggleSettingsMenu);
            document.getElementById('btn-respawn').addEventListener('click', () => {
                playerHealth = maxHealth;
                controls.getObject().position.set(0, 3, 0);
                updateHeartsUI();
                toggleSettingsMenu();
                showActionText("Respawned Player!");
            });

            scene.add(controls.getObject());
            controls.getObject().position.set(0, 3, 0);

            buildColosseumArenaInstanced();
            buildHeldItemModels();
            setupControls();
            setupMouseInteraction();
            populateFullInventoryGUI();

            if (isMobile) setupMobileDpadControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function startGame() {
            document.getElementById('blocker').style.display = 'none';
            if (!isMobile) { controls.lock(); } 
            else {
                document.getElementById('dpad-container').style.display = 'block';
                document.getElementById('mobile-buttons').style.display = 'flex';
            }
        }

        function populateFullInventoryGUI() {
            const container = document.getElementById('inv-grid-container');
            container.innerHTML = '';
            const items = [
                { icon: '🔨', type: 'mace' }, { icon: '🔮', type: 'crystal' }, { icon: '⬛', type: 'obsidian' }, { icon: '🗿', type: 'totem' }, { icon: '🍎', type: 'gapple' },
                { icon: '🏹', type: 'arrow' }, { icon: '🚀', type: 'firework' }, { icon: '🔨', type: 'mace' }
            ];

            items.forEach(item => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                slot.innerHTML = `${item.icon}<span class="count-badge">64</span>`;
                slot.onclick = () => {
                    counts[item.type] = 64;
                    const badgeId = item.type === 'gapple' ? 'gapple-count' : `${item.type}-count`;
                    const badge = document.getElementById(badgeId);
                    if (badge) badge.innerText = 64;
                    showActionText(`Refilled ${item.type.toUpperCase()} to 64!`);
                };
                container.appendChild(slot);
            });
        }

        function toggleInventory() {
            isInventoryOpen = !isInventoryOpen;
            const invScreen = document.getElementById('inventory-screen');
            if (isInventoryOpen) {
                invScreen.style.display = 'flex';
                if (!isMobile) controls.unlock();
            } else {
                invScreen.style.display = 'none';
                if (!isMobile) controls.lock();
            }
        }

        function toggleSettingsMenu() {
            isSettingsOpen = !isSettingsOpen;
            const settingsMenu = document.getElementById('esc-settings-menu');
            if (isSettingsOpen) {
                settingsMenu.style.display = 'flex';
                if (!isMobile) controls.unlock();
            } else {
                settingsMenu.style.display = 'none';
                if (!isMobile) controls.lock();
            }
        }

        function createStevePlayerMesh(color = 0x00aaff, isBot = false) {
            const steveGroup = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            steveGroup.add(body);

            const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            steveGroup.add(head);

            if (isBot) {
                const wingGeo = new THREE.BoxGeometry(0.1, 0.9, 0.4);
                const wingMat = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.3 });
                const leftWing = new THREE.Mesh(wingGeo, wingMat);
                leftWing.position.set(-0.35, 1.1, -0.25);
                leftWing.rotation.set(0.2, 0.3, 0.4);
                steveGroup.add(leftWing);

                const rightWing = new THREE.Mesh(wingGeo, wingMat);
                rightWing.position.set(0.35, 1.1, -0.25);
                rightWing.rotation.set(0.2, -0.3, -0.4);
                steveGroup.add(rightWing);
            }

        }

        function createOverheadHealthBar() {
            const barGroup = new THREE.Group();
            const bgGeo = new THREE.PlaneGeometry(1.4, 0.2);
            const bgMat = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide });
            barGroup.add(new THREE.Mesh(bgGeo, bgMat));

            const fgGeo = new THREE.PlaneGeometry(1.36, 0.16);
            const fgMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
            const fg = new THREE.Mesh(fgGeo, fgMat);
            fg.position.z = 0.01;
            barGroup.add(fg);

            barGroup.userData = { fgMesh: fg };
            return barGroup;
        }

        function spawnAISteve() {
            aiSteveMesh = createStevePlayerMesh(0x00ffaa, true);
            aiSteveMesh.position.set(10, 0.5, 10);
            aiSteveHealthBarMesh = createOverheadHealthBar();
            aiSteveHealthBarMesh.position.set(0, 2.6, 0);
            aiSteveMesh.add(aiSteveHealthBarMesh);
            scene.add(aiSteveMesh);
            showActionText(`AI Steve Bot Joined (${botDifficulty.toUpperCase()} Mode!)`);
        }

        function spawnBrotherPlayer() {
            broPlayerMesh = createStevePlayerMesh(0xff0055, false);
            broPlayerMesh.position.set(-8, 0.5, -8);
            scene.add(broPlayerMesh);
            showActionText("Brother Player Added!");
        }

        function updateSteveHealthBarUI() {
            if (!aiSteveHealthBarMesh) return;
            const fg = aiSteveHealthBarMesh.userData.fgMesh;
            const healthPct = Math.max(0, aiSteveHealth / maxHealth);
            fg.scale.x = healthPct;
            fg.position.x = (healthPct - 1) * 0.68;
        }

        function damageAISteve(amount) {
            aiSteveHealth -= amount;
            if (aiSteveHealth <= 0) {
                if (aiSteveTotems > 0) {
                    aiSteveTotems--;
                    aiSteveHealth = maxHealth;
                    playSound('totem');
                    showActionText(`AI STEVE POPPED A TOTEM! (${aiSteveTotems} left)`);
                } else {
                    playSound('explode');
                    showActionText("YOU KILLED AI STEVE!");
                    scene.remove(aiSteveMesh);
                    aiSteveMesh = null;
                    setTimeout(() => {
                        if (gameMode === 'ai') { aiSteveTotems = 64; aiSteveHealth = maxHealth; spawnAISteve(); }
                    }, 3000);
                    return;
                }
            }
            updateSteveHealthBarUI();
        }

        function initMultiplayer(roomCode) {
            const fullRoomID = "donut-smp-match-" + roomCode;
            remotePlayerMesh = createStevePlayerMesh(0xff0055, false);
            remotePlayerMesh.position.set(-10, 0.5, -10);
            let remoteHealthBar = createOverheadHealthBar();
            remoteHealthBar.position.set(0, 2.6, 0);
            remotePlayerMesh.add(remoteHealthBar);
            scene.add(remotePlayerMesh);

            peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(fullRoomID);
                conn.on('open', () => { peerConn = conn; setupPeerEvents(peerConn); showActionText("Connected as Client!"); });
                setTimeout(() => {
                    if (!peerConn || !peerConn.open) { peer.destroy(); startHostingRoom(fullRoomID, roomCode); }
                }, 2000);
            });
        }

        function startHostingRoom(fullRoomID, roomCode) {
            peer = new Peer(fullRoomID);
            peer.on('open', () => {
                showActionText("Hosting Room Code: " + roomCode);
                peer.on('connection', (conn) => { peerConn = conn; setupPeerEvents(peerConn); showActionText("Friend Connected!"); });
            });
        }

        function setupPeerEvents(conn) {
            conn.on('data', (data) => {
                if (data.type === 'pos') { if (remotePlayerMesh) remotePlayerMesh.position.set(data.x, data.y - 1.5, data.z); }
                else if (data.type === 'obsidian') placeObsidianBlock(data.x, data.y, data.z);
                else if (data.type === 'crystal') placeEndCrystal(data.x, data.y, data.z);
            });
        }

        function broadcastPlayerPos() {
            if (peerConn && peerConn.open) {
                peerConn.send({ type: 'pos', x: camera.position.x, y: camera.position.y, z: camera.position.z });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function buildColosseumArenaInstanced() {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const radius = 35;
            const sandMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.9 });

            const sandPositions = [];
            for (let x = -radius; x <= radius; x++) {
                for (let z = -radius; z <= radius; z++) {
                    if (x * x + z * z <= radius * radius) sandPositions.push(new THREE.Vector3(x, 0, z));
                }
            }

            const sandInstanced = new THREE.InstancedMesh(boxGeo, sandMat, sandPositions.length);
            const dummyMatrix = new THREE.Matrix4();
            sandPositions.forEach((pos, i) => {
                dummyMatrix.setPosition(pos);
                sandInstanced.setMatrixAt(i, dummyMatrix);
                const invisibleMesh = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ visible: false }));
                invisibleMesh.position.copy(pos);
                scene.add(invisibleMesh);
                placeableObjects.push(invisibleMesh);
            });
            sandInstanced.instanceMatrix.needsUpdate = true;
            scene.add(sandInstanced);
        }

        function buildHeldItemModels() {
            swordMesh = new THREE.Group();
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.9, 0.04), new THREE.MeshStandardMaterial({ color: 0x55ffff, metalness: 0.8 }));
            blade.position.y = 0.45;
            swordMesh.add(blade);
            swordMesh.position.set(0.35, -0.35, -0.5);
            camera.add(swordMesh);

            heldTotemMesh = new THREE.Group();
            heldTotemMesh.add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 0.15), new THREE.MeshStandardMaterial({ color: 0xffaa00 })));
            heldTotemMesh.position.set(0.35, -0.35, -0.5);
            heldTotemMesh.visible = false;
            camera.add(heldTotemMesh);

            maceMesh = new THREE.Group();
            maceMesh.add(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8), new THREE.MeshStandardMaterial({ color: 0x3a2512 })));
            maceMesh.position.set(0.35, -0.35, -0.5);
            maceMesh.visible = false;
            camera.add(maceMesh);
        }

        function createEndCrystalMesh() {
            const crystalGroup = new THREE.Group();
            crystalGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.9), new THREE.MeshStandardMaterial({ color: 0x150b24 })));
            const outerCrystal = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.65, 0.65), new THREE.MeshPhongMaterial({ color: 0xda70d6, emissive: 0x8a2be2, transparent: true, opacity: 0.85 }));
            outerCrystal.position.y = 0.85;
            crystalGroup.add(outerCrystal);
            crystalGroup.userData = { outerCrystal: outerCrystal, floatOffset: Math.random() * Math.PI * 2 };
            return crystalGroup;
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Escape') {
                    if (isInventoryOpen) toggleInventory();
                    else toggleSettingsMenu();
                    return;
                }
                if (isSettingsOpen || isInventoryOpen) return;

                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': 
                        if (canJump) { velocity.y += 11.0; canJump = false; } 
                        else if (currentSlot === 7 && !isGliding && controls.getObject().position.y > 3.0) {
                            isGliding = true;
                            showActionText("Elytra Gliding Activated!");
                        }
                        break;
                    case 'KeyE': toggleInventory(); break;
                    case 'Digit1': selectSlot(1); break;
                    case 'Digit2': selectSlot(2); break;
                    case 'Digit3': selectSlot(3); break;
                    case 'Digit4': selectSlot(4); break;
                    case 'Digit5': selectSlot(5); break;
                    case 'Digit6': selectSlot(6); break;
                    case 'Digit7': selectSlot(7); break;
                    case 'Digit8': selectSlot(8); break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            });

            document.addEventListener('wheel', (e) => {
                if (e.deltaY > 0) selectSlot(currentSlot % 8 + 1);
                else selectSlot((currentSlot - 2 + 8) % 8 + 1);
            });
        }

        function setupMobileDpadControls() {
            // Bind D-Pad button events (exact match to user request)
            const bindBtn = (id, onDown, onUp) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e) => { e.preventDefault(); el.classList.add('pressed'); onDown(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); el.classList.remove('pressed'); onUp(); });
                el.addEventListener('touchcancel', (e) => { e.preventDefault(); el.classList.remove('pressed'); onUp(); });
            };

            bindBtn('dpad-up', () => { moveForward = true; }, () => { moveForward = false; });
            bindBtn('dpad-down', () => { moveBackward = true; }, () => { moveBackward = false; });
            bindBtn('dpad-left', () => { moveLeft = true; }, () => { moveLeft = false; });
            bindBtn('dpad-right', () => { moveRight = true; }, () => { moveRight = false; });

            // Look around touch handling on the right side of the screen
            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.clientX >= window.innerWidth / 2 && touchLookID === null) {
                        touchLookID = touch.identifier;
                        touchLookLastX = touch.clientX;
                        touchLookLastY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchLookID && !isInventoryOpen && !isSettingsOpen) {
                        const deltaX = touch.clientX - touchLookLastX;
                        const deltaY = touch.clientY - touchLookLastY;
                        cameraEuler.setFromQuaternion(camera.quaternion);
                        cameraEuler.y -= deltaX * 0.005;
                        cameraEuler.x -= deltaY * 0.005;
                        cameraEuler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraEuler.x));
                        camera.quaternion.setFromEuler(cameraEuler);
                        touchLookLastX = touch.clientX;
                        touchLookLastY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchLookID) touchLookID = null;
                }
            });

            document.getElementById('btn-inv').addEventListener('touchstart', (e) => { e.preventDefault(); toggleInventory(); });
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (canJump) { velocity.y += 11.0; canJump = false; }
            });
            document.getElementById('btn-hit').addEventListener('touchstart', (e) => { e.preventDefault(); handleLeftClick(); });
            document.getElementById('btn-place').addEventListener('touchstart', (e) => { e.preventDefault(); handleRightClick(); });
        }

        function selectSlot(slotNum) {
            currentSlot = slotNum;
            for (let i = 1; i <= 8; i++) {
                const el = document.getElementById(`slot-${i}`);
                if (el) {
                    if (i === slotNum) el.classList.add('active');
                    else el.classList.remove('active');
                }
            }
            if (swordMesh) swordMesh.visible = (currentSlot === 1);
            if (heldTotemMesh) heldTotemMesh.visible = (currentSlot === 5);
            if (maceMesh) maceMesh.visible = (currentSlot === 8);
        }

        function setupMouseInteraction() {
            document.addEventListener('mousedown', (e) => {
                if (isInventoryOpen || isSettingsOpen) return;
                if (!controls.isLocked && !isMobile) return;
                if (e.button === 0) handleLeftClick();
                else if (e.button === 2) handleRightClick();
            });
        }

        function handleLeftClick() {
            if (currentSlot === 1) { playSound('sword'); }
            else if (currentSlot === 6) { shootCrossbow(); return; }
            else if (currentSlot === 8) { playSound('mace'); }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const crystalHits = raycaster.intersectObjects(endCrystals, true);
            if (crystalHits.length > 0) {
                let hitObj = crystalHits[0].object;
                while (hitObj.parent && hitObj.parent !== scene) hitObj = hitObj.parent;
                detonateCrystal(hitObj);
                return;
            }

            if (aiSteveMesh) {
                const steveHits = raycaster.intersectObjects(aiSteveMesh.children, true);
                if (steveHits.length > 0) { damageAISteve(3); return; }
            }
        }

        function handleRightClick() {
            if (currentSlot === 2) { eatGoldenApple(); return; }
            if (currentSlot === 7) { useFireworkBoost(); return; }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(placeableObjects, false);

            if (intersects.length > 0 && intersects[0].distance <= 6.5) {
                const hit = intersects[0];
                const point = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(0.5));
                const gx = Math.round(point.x), gy = Math.round(point.y), gz = Math.round(point.z);

                if (currentSlot === 4 && counts.obsidian > 0) {
                    placeObsidianBlock(gx, gy, gz);
                    if (peerConn && peerConn.open) peerConn.send({ type: 'obsidian', x: gx, y: gy, z: gz });
                } else if (currentSlot === 3 && counts.crystal > 0) {
                    placeEndCrystal(gx, gy, gz);
                    if (peerConn && peerConn.open) peerConn.send({ type: 'crystal', x: gx, y: gy, z: gz });
                }
            }
        }

        function placeObsidianBlock(x, y, z) {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x1a0d2b }));
            obs.position.set(x, y, z);
            scene.add(obs);
            placeableObjects.push(obs);
            counts.obsidian--;
            document.getElementById('obsidian-count').innerText = counts.obsidian;
            playSound('place');
        }

        function placeEndCrystal(x, y, z) {
            const crystal = createEndCrystalMesh();
            crystal.position.set(x, y - 0.5, z);
            scene.add(crystal);
            endCrystals.push(crystal);
            counts.crystal--;
            document.getElementById('crystal-count').innerText = counts.crystal;
            playSound('place');
        }

        function shootCrossbow() {
            if (counts.arrow <= 0) return;
            counts.arrow--;
            document.getElementById('arrow-count').innerText = counts.arrow;
            playSound('shoot');

            const arrow = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            arrow.position.copy(camera.position).add(dir.clone().multiplyScalar(0.8));
            arrow.quaternion.copy(camera.quaternion);
            arrow.rotateX(Math.PI / 2);
            scene.add(arrow);
            activeArrows.push({ mesh: arrow, dir: dir.clone().multiplyScalar(45.0), age: 0 });
        }

        function useFireworkBoost() {
            if (counts.firework <= 0) return;
            counts.firework--;
            document.getElementById('firework-count').innerText = counts.firework;
            playSound('firework');
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            velocity.x += dir.x * 25.0; velocity.y += dir.y * 20.0 + 5.0; velocity.z += dir.z * 25.0;
            isGliding = true;
            spawnParticleExplosion(camera.position);
            showActionText("FIREWORK BOOST!");
        }

        function eatGoldenApple() {
            if (counts.gapple <= 0) return;
            if (playerHealth < maxHealth) {
                playerHealth = Math.min(maxHealth, playerHealth + 4);
                updateHeartsUI();
                counts.gapple--;
                document.getElementById('gapple-count').innerText = counts.gapple;
                playSound('eat');
                showActionText("Ate Golden Apple! +4 Hearts");
            }
        }

        function detonateCrystal(crystalObj) {
            const index = endCrystals.indexOf(crystalObj);
            if (index > -1) endCrystals.splice(index, 1);
            const pos = crystalObj.position.clone();
            scene.remove(crystalObj);
            playSound('explode');
            spawnParticleExplosion(pos);

            const playerDist = camera.position.distanceTo(pos);
            if (playerDist < 6.0) {
                takeDamage(Math.round((1 - playerDist / 6.0) * 8));
            }
            if (aiSteveMesh) {
                const botDist = aiSteveMesh.position.distanceTo(pos);
                if (botDist < 6.0) damageAISteve(Math.round((1 - botDist / 6.0) * 8));
            }
        }

        function spawnParticleExplosion(pos) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(40 * 3);
            const velocities = [];
            for (let i = 0; i < 40; i++) {
                positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y + 0.5; positions[i * 3 + 2] = pos.z;
                velocities.push(new THREE.Vector3((Math.random() - 0.5) * 10, Math.random() * 6 + 2, (Math.random() - 0.5) * 10));
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const pSystem = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xff5500, size: 0.25, transparent: true, opacity: 1.0 }));
            pSystem.userData = { velocities: velocities, age: 0 };
            scene.add(pSystem);
            particleSystems.push(pSystem);
        }

        function takeDamage(amount) {
            playerHealth -= amount;
            if (playerHealth <= 0) {
                if (counts.totem > 0) {
                    counts.totem--;
                    document.getElementById('totem-count').innerText = counts.totem;
                    playerHealth = 4;
                    playSound('totem');
                    showActionText("TOTEM POPPED!");
                } else {
                    playerHealth = maxHealth;
                    controls.getObject().position.set(0, 3, 0);
                    showActionText("You died! Respawned.");
                }
            }
            updateHeartsUI();
        }

        function updateHeartsUI() {
            const hearts = document.querySelectorAll('#hearts-container .pixel-heart');
            hearts.forEach((heart, idx) => {
                if (idx < playerHealth) heart.classList.remove('empty');
                else heart.classList.add('empty');
            });
        }

        function showActionText(msg) {
            const el = document.getElementById('action-text');
            el.innerText = msg;
            el.style.opacity = 1;
            if (textTimeout) clearTimeout(textTimeout);
            textTimeout = setTimeout(() => { el.style.opacity = 0; }, 1800);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if ((controls.isLocked || isMobile) && !isInventoryOpen && !isSettingsOpen) {
                let speedDrag = isGliding ? 2.0 : 10.0;
                velocity.x -= velocity.x * speedDrag * delta;
                velocity.z -= velocity.z * speedDrag * delta;
                if (isGliding) velocity.y -= 4.0 * delta;
                else velocity.y -= 25.0 * delta;

                const inputDir = new THREE.Vector3(Number(moveRight) - Number(moveLeft), 0, Number(moveForward) - Number(moveBackward)).normalize();
                if (moveForward || moveBackward) velocity.z -= inputDir.z * 80.0 * delta;
                if (moveLeft || moveRight) velocity.x -= inputDir.x * 80.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += velocity.y * delta;

                if (controls.getObject().position.y < 2.5) {
                    velocity.y = 0;
                    controls.getObject().position.y = 2.5;
                    canJump = true;
                    isGliding = false;
                }

                if (gameMode === 'mp') broadcastPlayerPos();
                if (gameMode === 'ai' && aiSteveMesh) {
                    const playerPos = camera.position;
                    const dir = playerPos.clone().sub(aiSteveMesh.position);
                    dir.y = 0; dir.normalize();
                    aiSteveMesh.position.x += dir.x * 4.0 * delta;
                    aiSteveMesh.position.z += dir.z * 4.0 * delta;
                    aiSteveMesh.lookAt(playerPos.x, aiSteveMesh.position.y, playerPos.z);
                    if (aiSteveHealthBarMesh) aiSteveHealthBarMesh.lookAt(camera.position);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
